<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GS 세일즈 데이터 챗</title>
<meta name="theme-color" content="#0f1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0f1117;--bg2:#161921;--bg3:#1c1f2a;--bg4:#242836;
  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.07);--glass3:rgba(255,255,255,.10);
  --ink:#f0f0f4;--ink2:#c8cad0;--ink3:#8b8f9a;--ink4:#5c6070;
  --gold:#d4a74a;--gold2:#ecc06a;--gold3:#f5d98a;--gold-glow:rgba(212,167,74,.15);
  --rose:#e87a8a;--violet:#a07ee8;--cyan:#5cc4d0;--mint:#5cc49a;
  --rule:rgba(255,255,255,.08);
  --sans:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,sans-serif;
  --mono:'JetBrains Mono','D2Coding',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.top-bar{background:var(--bg);border-bottom:1px solid var(--rule);padding:0 24px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top-brand{font-size:13px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:8px}
.top-brand-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
.top-back{font-size:12px;color:var(--ink3);text-decoration:none;padding:5px 12px;border:1px solid var(--rule);border-radius:16px;transition:all .2s}
.top-back:hover{color:var(--gold2);border-color:var(--gold)}
.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:920px;width:100%;margin:0 auto;padding:0 16px;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:24px 0 16px;display:flex;flex-direction:column;gap:16px}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:var(--ink4);border-radius:4px}
.msg{max-width:96%;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-user{align-self:flex-end}
.msg-bot{align-self:flex-start}
.msg-bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.65;word-break:keep-all}
.msg-user .msg-bubble{background:var(--gold);color:#111;border-bottom-right-radius:4px;font-weight:500}
.msg-bot .msg-bubble{background:var(--bg3);color:var(--ink);border-bottom-left-radius:4px;border:1px solid var(--rule)}
.preview-wrap{margin-top:12px;overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--bg2);max-height:420px;overflow-y:auto}
.preview-wrap::-webkit-scrollbar{width:4px;height:4px}
.preview-wrap::-webkit-scrollbar-thumb{background:var(--ink4);border-radius:3px}
.pv-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.pv-table th{background:var(--bg4);color:var(--ink3);font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:1;font-size:11px;letter-spacing:.02em}
.pv-table th.num{text-align:right}
.pv-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--ink2)}
.pv-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.pv-table tbody tr:hover{background:var(--glass)}
.pv-table tr.row-total td{background:rgba(212,167,74,.06);color:var(--gold2);font-weight:600;border-top:1px solid rgba(212,167,74,.2)}
.pv-table td.pos{color:var(--mint)}
.pv-table td.neg{color:var(--rose)}
.pv-count{font-size:11px;color:var(--ink4);margin-top:6px}
.dl-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 16px;border-radius:10px;border:1px solid var(--gold);background:rgba(212,167,74,.12);color:var(--gold2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none}
.dl-btn:hover{background:rgba(212,167,74,.25);color:var(--gold3)}
.dl-icon{width:16px;height:16px}
.welcome{text-align:center;padding:48px 16px 24px}
.welcome h2{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:8px}
.welcome p{font-size:14px;color:var(--ink3);line-height:1.6;margin-bottom:24px}
.templates{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tpl-btn{padding:8px 14px;border-radius:20px;border:1px solid var(--rule);background:var(--glass);color:var(--ink2);font-size:12.5px;cursor:pointer;transition:all .2s;font-family:var(--sans)}
.tpl-btn:hover{border-color:var(--gold);color:var(--gold2);background:var(--gold-glow)}
.input-area{flex-shrink:0;padding:12px 0 20px;border-top:1px solid var(--rule)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-field{flex:1;resize:none;border:1px solid var(--rule);border-radius:14px;background:var(--bg2);color:var(--ink);font-family:var(--sans);font-size:14px;padding:12px 16px;outline:none;min-height:46px;max-height:100px;line-height:1.5;transition:border-color .2s}
.input-field:focus{border-color:var(--gold)}
.input-field::placeholder{color:var(--ink4)}
.send-btn{width:46px;height:46px;border-radius:14px;border:none;background:var(--gold);color:#111;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.send-btn:hover{background:var(--gold2)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.send-icon{width:20px;height:20px}
.typing{display:flex;gap:4px;padding:8px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:bounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{transform:translateY(-6px);opacity:.4}}
.footer-note{text-align:center;font-size:11px;color:var(--ink4);padding:0 0 12px}
@media(max-width:600px){
  .chat-wrap{padding:0 8px}
  .welcome{padding:32px 8px 16px}
  .welcome h2{font-size:18px}
  .templates{gap:6px}
  .tpl-btn{font-size:11.5px;padding:7px 11px}
}
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-brand"><span class="top-brand-dot"></span>GS DATA CHAT</div>
  <a class="top-back" href="gs-sales.html">Sales Home</a>
</div>
<div class="chat-wrap">
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <h2>세일즈 데이터 챗</h2>
      <p>실적 데이터를 자연어로 질문하면 테이블 프리뷰와 엑셀 파일을 제공합니다.<br>
      사업장·채널·세그먼트·국적·기간을 포함해 질문해 주세요.</p>
      <div class="templates" id="templates"></div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea class="input-field" id="userInput" rows="1"
        placeholder="예: 델피노 2026년 OTA 실적, 아고다 올해 실적, 대만 인바운드 현황"></textarea>
      <button class="send-btn" id="sendBtn" title="전송">
        <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
  <div class="footer-note">읽기 전용 · 실적 데이터 한정 · 사업장 / 채널 / 세그먼트 / 국적</div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   GS 세일즈 데이터 챗 v3 — 채널 + 국적 + 목표 + FCST + YoY
   ═══════════════════════════════════════════════════════════ */

let CI = null;
let isLoading = false;

const TEMPLATES = [
  "델피노 2026년 OTA 실적",
  "소노캄 고양 올해 G-OTA 실적",
  "아고다 2026년 실적",
  "대만 인바운드 올해 현황",
  "전사 2025년 전체 세그먼트 실적",
  "쏠비치 삼척 2025년 1월~6월 OTA",

// ── 사업장 별칭 ──
const PROP_ALIASES = {
  "비발디": ["소노벨 비발디파크","소노캄 비발디파크","소노펠리체 비발디파크","소노펠리체 빌리지 비발디파크","소노펫 비발디파크","소노문 비발디파크"],
  "비발디파크": ["소노벨 비발디파크","소노캄 비발디파크","소노펠리체 비발디파크","소노펠리체 빌리지 비발디파크","소노펫 비발디파크","소노문 비발디파크"],

  "소노문 단양": ["소노문 단양"], "단양": ["소노문 단양"],
  "소노문 비발디": ["소노문 비발디파크"],
  "소노문 해운대": ["소노문 해운대"], "해운대": ["소노문 해운대"],
  "소노벨 경주": ["소노벨 경주"], "경주": ["소노벨 경주"],
  "소노벨 변산": ["소노벨 변산"], "변산": ["소노벨 변산"],
  "소노벨 비발디파크": ["소노벨 비발디파크"],
  "소노벨 제주": ["소노벨 제주"],
  "소노벨 천안": ["소노벨 천안"], "천안": ["소노벨 천안"],
  "소노벨 청송": ["소노벨 청송"], "청송": ["소노벨 청송"],
  "소노캄 거제": ["소노캄 거제"], "거제": ["소노캄 거제"],
  "소노캄 고양": ["소노캄 고양"], "고양": ["소노캄 고양"],
  "소노캄 비발디파크": ["소노캄 비발디파크"],
  "소노캄 여수": ["소노캄 여수"], "여수": ["소노캄 여수"],
  "소노캄 제주": ["소노캄 제주"],
  "소노펠리체 비발디파크": ["소노펠리체 비발디파크"], "펠리체": ["소노펠리체 비발디파크"],
  "소노펠리체 빌리지 비발디파크": ["소노펠리체 빌리지 비발디파크"], "빌리지": ["소노펠리체 빌리지 비발디파크"],
  "소노펫 비발디파크": ["소노펫 비발디파크"], "소노펫": ["소노펫 비발디파크"],
  "소노휴 양평": ["소노휴 양평"], "양평": ["소노휴 양평"],
  "쏠비치 남해": ["쏠비치 남해"], "남해": ["쏠비치 남해"],
  "쏠비치 삼척": ["쏠비치 삼척"], "삼척": ["쏠비치 삼척"],
  "쏠비치 양양": ["쏠비치 양양"], "양양": ["쏠비치 양양"],
  "쏠비치 진도": ["쏠비치 진도"], "진도": ["쏠비치 진도"],
  "오션월드빌리지": ["오션월드빌리지"], "오션월드": ["오션월드빌리지"],
  "팔라티움": ["팔라티움"],
};

// ── 세그먼트 별칭 (다양한 입력 허용) ──
const SEG_ALIASES = {
  "ota": "OTA", "오타": "OTA", "OTA": "OTA",
  "g-ota": "G-OTA", "G-OTA": "G-OTA", "gota": "G-OTA", "GOTA": "G-OTA",
  "g ota": "G-OTA", "G OTA": "G-OTA", "g_ota": "G-OTA", "G_OTA": "G-OTA",
  "글로벌ota": "G-OTA", "글로벌 ota": "G-OTA", "글로벌OTA": "G-OTA",
  "지오타": "G-OTA", "지OTA": "G-OTA", "글로벌": "G-OTA",
  "inbound": "Inbound", "Inbound": "Inbound", "INBOUND": "Inbound",
  "인바운드": "Inbound", "IB": "Inbound", "ib": "Inbound",
  "전체": "전체", "전세그먼트": "전체", "모든 세그먼트": "전체", "합계": "전체",
};

// ── 주요 채널 별칭 ──
const CHANNEL_ALIASES = {
  "아고다": "아고다", "agoda": "아고다",
  "트립닷컴": "트립닷컴", "trip.com": "트립닷컴", "trip": "트립닷컴",
  "익스피디아": "익스피디아", "expedia": "익스피디아",
  "부킹닷컴": "부킹닷컴", "booking.com": "부킹닷컴", "부킹": "부킹닷컴",
  "여기어때": "여기어때", "야놀자": "야놀자", "네이버": "네이버",
  "놀": "야놀자",
};

// ── 국적 별칭 ──
const NAT_ALIASES = {
  "일본": "일본", "japan": "일본", "jp": "일본",
  "중국": "중국", "china": "중국", "cn": "중국",
  "대만": "대만", "taiwan": "대만", "tw": "대만",
  "홍콩": "홍콩", "hongkong": "홍콩", "hk": "홍콩",
  "베트남": "베트남", "vietnam": "베트남", "vn": "베트남",
  "태국": "태국", "thailand": "태국", "th": "태국",
  "미주": "미주", "미국": "미주", "usa": "미주", "us": "미주",
  "필리핀": "필리핀", "philippines": "필리핀",
  "말레이시아": "말레이시아", "malaysia": "말레이시아",
  "싱가포르": "싱가포르", "singapore": "싱가포르",
  "인도네시아": "인도네시아", "indonesia": "인도네시아",
  "동남아": null, // 여러 국적 묶음 — 별도 처리
};
const SOUTHEAST_ASIA = ["베트남","태국","필리핀","말레이시아","싱가포르","인도네시아"];

const SALES_KEYWORDS = [
  "실적","매출","rn","adr","revenue","객실","단가","판매","현황","목표","예산",
  "fcst","forecast","예측","달성","달성률","yoy","전년","작년","올해","금년",
  "월별","연간","분기","전체","채널","국적","인바운드",
  "ota","g-ota","gota","inbound",
];

// ── 초기화 ──
(async function init() {
  renderTemplates();
  try {
    const r = await fetch("data/chat_index.json?t=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    CI = await r.json();
    CI.properties.forEach(p => { if (!SALES_KEYWORDS.includes(p)) SALES_KEYWORDS.push(p); });
    // 채널명도 실적 키워드에 추가
    Object.keys(CI.by_channel || {}).forEach(ch => { if (!SALES_KEYWORDS.includes(ch)) SALES_KEYWORDS.push(ch); });
    // 국적도
    (CI.nationalities || []).forEach(n => { if (!SALES_KEYWORDS.includes(n)) SALES_KEYWORDS.push(n); });
    console.log("[chat] loaded:", CI.properties.length, "props,", Object.keys(CI.by_channel||{}).length, "channels,", (CI.nationalities||[]).length, "nationalities");
  } catch (e) {
    console.error("[chat] load fail:", e);
    addBotMsg("데이터 로드에 실패했습니다. 페이지를 새로고침해 주세요.");
  }
})();

function renderTemplates() {
  const box = document.getElementById("templates");
  TEMPLATES.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "tpl-btn"; btn.textContent = t;
    btn.onclick = () => { document.getElementById("userInput").value = t; handleSend(); };
    box.appendChild(btn);
  });
}

const msgBox = document.getElementById("messages");
function addUserMsg(text) { hideWelcome(); const d = document.createElement("div"); d.className = "msg msg-user"; d.innerHTML = `<div class="msg-bubble">${esc(text)}</div>`; msgBox.appendChild(d); scrollDown(); }
function addBotMsg(html) { const d = document.createElement("div"); d.className = "msg msg-bot"; d.innerHTML = `<div class="msg-bubble">${html}</div>`; msgBox.appendChild(d); scrollDown(); return d; }
function showTyping() { const d = document.createElement("div"); d.className = "msg msg-bot"; d.id = "typing"; d.innerHTML = `<div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`; msgBox.appendChild(d); scrollDown(); }
function hideTyping() { const el = document.getElementById("typing"); if (el) el.remove(); }
function scrollDown() { setTimeout(() => msgBox.scrollTop = msgBox.scrollHeight, 60); }
function hideWelcome() { const w = document.getElementById("welcome"); if (w) w.style.display = "none"; }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

const inputEl = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
sendBtn.addEventListener("click", handleSend);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); } });
inputEl.addEventListener("input", () => { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + "px"; });

function handleSend() {
  const q = inputEl.value.trim();
  if (!q || isLoading) return;
  inputEl.value = ""; inputEl.style.height = "auto";
  addUserMsg(q); processQuery(q);
}

// ═══════════════════════════════════════════════
// 메인 처리
// ═══════════════════════════════════════════════

function processQuery(query) {
  if (!CI) { addBotMsg("데이터가 아직 로드되지 않았습니다."); return; }
  isLoading = true; showTyping();

  setTimeout(() => {
    try {
      if (!isSalesQuery(query)) {
        hideTyping();
        addBotMsg("실적 데이터 관련 질문만 가능합니다.<br><br>" +
          "<b>질문 가능 범위:</b><br>" +
          "• <b>사업장</b> — 25개 사업장<br>" +
          "• <b>채널</b> — 아고다, 트립닷컴, 여기어때, 야놀자 등<br>" +
          "• <b>세그먼트</b> — OTA, G-OTA, Inbound<br>" +
          "• <b>국적</b> — 일본, 대만, 중국, 홍콩, 동남아 등<br>" +
          "• <b>기간</b> — 연도/월, 올해, 작년<br>" +
          "• <b>지표</b> — RN, ADR, 매출, 목표, FCST, YoY");
        isLoading = false; return;
      }

      const parsed = parseQuery(query);
      if (parsed.error) { hideTyping(); addBotMsg(parsed.error); isLoading = false; return; }

      const result = extractData(parsed);
      if (result.error) { hideTyping(); addBotMsg(result.error); isLoading = false; return; }

      hideTyping();
      showResultMsg(result, parsed);
    } catch (e) {
      console.error(e); hideTyping();
      addBotMsg("처리 중 오류: " + esc(e.message));
    }
    isLoading = false;
  }, 300);
}

function isSalesQuery(q) {
  const ql = q.toLowerCase().replace(/[-_]/g, "");
  return SALES_KEYWORDS.some(kw => ql.includes(kw.toLowerCase().replace(/[-_]/g, "")));
}

// ═══════════════════════════════════════════════
// 파싱
// ═══════════════════════════════════════════════

function parseQuery(q) {
  const ql = q.toLowerCase().replace(/\s+/g, " ");

  // 1) 쿼리 유형 감지: 국적 / 채널 / 사업장
  let queryType = "property"; // default
  let nationalities = [];
  let channels = [];
  let properties = [];
  let isTotal = false;

  // 국적 감지
  if (/동남아/i.test(q)) {
    nationalities = SOUTHEAST_ASIA.filter(n => (CI.by_nationality || {})[n]);
    if (nationalities.length > 0) queryType = "nationality";
  }
  if (nationalities.length === 0) {
    for (const [alias, nat] of Object.entries(NAT_ALIASES)) {
      if (nat && ql.includes(alias.toLowerCase())) {
        if ((CI.by_nationality || {})[nat] && !nationalities.includes(nat)) {
          nationalities.push(nat);
          queryType = "nationality";
        }
      }
    }
  }

  // 채널 감지 — 별칭 먼저
  for (const [alias, ch] of Object.entries(CHANNEL_ALIASES)) {
    if (ql.includes(alias.toLowerCase())) {
      // 실제 채널 데이터에서 찾기
      const found = Object.keys(CI.by_channel || {}).find(c => c.includes(ch));
      if (found && !channels.includes(found)) { channels.push(found); queryType = "channel"; }
    }
  }
  // 정확한 채널명 매칭
  if (channels.length === 0) {
    const allChannels = Object.keys(CI.by_channel || {}).sort((a, b) => b.length - a.length);
    for (const ch of allChannels) {
      if (q.includes(ch) || ql.includes(ch.toLowerCase())) {
        channels.push(ch); queryType = "channel"; break;
      }
    }
  }

  // 사업장 감지
  if (queryType === "property") {
    if (/전사|전체\s*사업장|모든\s*사업장|all\s*prop/i.test(q)) {
      isTotal = true;
    } else {
      const propNames = CI.properties.slice().sort((a, b) => b.length - a.length);
      for (const p of propNames) {
        if (q.includes(p)) properties.push(p);
      }
      if (properties.length === 0) {
        const aliasKeys = Object.keys(PROP_ALIASES).sort((a, b) => b.length - a.length);
        for (const alias of aliasKeys) {
          if (ql.includes(alias.toLowerCase()) || q.includes(alias)) {
            properties.push(...PROP_ALIASES[alias].filter(p => CI.properties.includes(p)));
            break;
          }
        }
      }
      properties = [...new Set(properties)];
    }

    if (!isTotal && properties.length === 0 && channels.length === 0 && nationalities.length === 0) {
      return { error: '사업장·채널·국적을 인식하지 못했습니다.<br><br>' +
        '<b>사업장:</b> ' + CI.properties.slice(0,10).join(", ") + ' ...<br>' +
        '<b>채널:</b> 아고다, 트립닷컴, 여기어때, 야놀자 등<br>' +
        '<b>국적:</b> ' + (CI.nationalities || []).slice(0,10).join(", ") };
    }
  }

  // 2) 세그먼트
  let segments = [];
  // 정규화: g-ota, gota, G OTA 등 모두 처리
  const qNorm = q.replace(/[-_\s]/g, "").toLowerCase();
  for (const [alias, seg] of Object.entries(SEG_ALIASES)) {
    const aNorm = alias.replace(/[-_\s]/g, "").toLowerCase();
    if (qNorm.includes(aNorm) || ql.includes(alias.toLowerCase())) {
      if (seg && !segments.includes(seg)) segments.push(seg);
    }
  }
  if (segments.length === 0) segments = ["전체"];

  // 3) 기간
  const months = parseMonths(q);
  if (months.error) return { error: months.error };

  return { queryType, properties, segments, months: months.result, isTotal, monthLabel: months.label, channels, nationalities };
}

function parseMonths(q) {
  const now = new Date();
  const thisYear = now.getFullYear();
  const allMonths = CI.months;

  const rangeMatch = q.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*[~\-부터]\s*(\d{1,2})\s*월/);
  if (rangeMatch) {
    const [, y, m1, m2] = rangeMatch;
    const results = [];
    for (let m = parseInt(m1); m <= parseInt(m2); m++) {
      const key = y + String(m).padStart(2, "0");
      if (allMonths.includes(key)) results.push(key);
    }
    if (results.length > 0) return { result: results, label: `${y}년 ${m1}월~${m2}월` };
  }

  const ymMatch = q.match(/(\d{4})\s*년\s*(\d{1,2})\s*월/g);
  if (ymMatch) {
    const results = [];
    for (const m of ymMatch) {
      const [, y, mo] = m.match(/(\d{4})\s*년\s*(\d{1,2})\s*월/);
      const key = y + String(mo).padStart(2, "0");
      if (allMonths.includes(key)) results.push(key);
    }
    if (results.length > 0) return { result: results, label: ymMatch.join(", ") };
  }

  const yearMatch = q.match(/(\d{4})\s*년/);
  if (yearMatch) {
    const y = yearMatch[1];
    const filtered = allMonths.filter(m => m.startsWith(y));
    if (filtered.length > 0) return { result: filtered, label: y + "년" };
    return { error: `${y}년 데이터 없음. 가용: ${[...new Set(allMonths.map(m => m.slice(0,4)))].join(", ")}년` };
  }

  if (/올해|금년|이번\s*해/.test(q)) {
    const y = String(thisYear), f = allMonths.filter(m => m.startsWith(y));
    if (f.length > 0) return { result: f, label: y + "년 (올해)" };
  }
  if (/작년|전년|지난\s*해/.test(q)) {
    const y = String(thisYear - 1), f = allMonths.filter(m => m.startsWith(y));
    if (f.length > 0) return { result: f, label: y + "년 (작년)" };
  }
  if (/재작년|전전년/.test(q)) {
    const y = String(thisYear - 2), f = allMonths.filter(m => m.startsWith(y));
    if (f.length > 0) return { result: f, label: y + "년 (재작년)" };
  }
  if (/이번\s*달|이달|당월/.test(q)) {
    const key = String(thisYear) + String(now.getMonth()+1).padStart(2,"0");
    if (allMonths.includes(key)) return { result: [key], label: thisYear+"년 "+(now.getMonth()+1)+"월" };
  }
  if (/지난\s*달|전월/.test(q)) {
    let y=thisYear, m=now.getMonth(); if(m<1){m=12;y--;}
    const key = String(y)+String(m).padStart(2,"0");
    if (allMonths.includes(key)) return { result: [key], label: y+"년 "+m+"월" };
  }
  const monthOnly = q.match(/(\d{1,2})\s*월/);
  if (monthOnly) {
    const mo = parseInt(monthOnly[1]);
    if (mo >= 1 && mo <= 12) {
      const key = String(thisYear)+String(mo).padStart(2,"0");
      if (allMonths.includes(key)) return { result: [key], label: thisYear+"년 "+mo+"월" };
    }
  }
  if (/yoy|전년\s*비교|동기간|전년\s*대비|vs\s*작년/i.test(q)) {
    const ty = String(thisYear), ly = String(thisYear-1);
    const f = allMonths.filter(m => m.startsWith(ty)||m.startsWith(ly));
    if (f.length > 0) return { result: f, label: ly+"~"+ty+"년 (YoY)" };
  }

  // 기본: 올해
  const y = String(thisYear), f = allMonths.filter(m => m.startsWith(y));
  if (f.length > 0) return { result: f, label: y + "년 (기본)" };
  return { result: allMonths, label: "전체 기간" };
}

// ═══════════════════════════════════════════════
// 데이터 추출
// ═══════════════════════════════════════════════

function extractData(parsed) {
  const { queryType, properties, segments, months, isTotal, monthLabel, channels, nationalities } = parsed;
  const rows = [];

  if (queryType === "nationality") {
    // 국적별 조회
    for (const nat of nationalities) {
      const nd = (CI.by_nationality || {})[nat];
      if (!nd) continue;
      for (const m of months) {
        const d = nd[m];
        if (d) rows.push({ 국적: nat, 연도: m.slice(0,4), 월: parseInt(m.slice(4)),
          RN: d.rn, "ADR(천원)": d.adr, "매출(백만원)": d.rev });
      }
    }
    if (rows.length === 0) return { error: "해당 국적의 데이터가 없습니다." };
    const label = nationalities.join(", ");
    return buildResult(rows, `국적_${label}`, `${label} · ${monthLabel}`, parsed,
      ["국적","연도","월","RN","ADR(천원)","매출(백만원)"]);
  }

  if (queryType === "channel") {
    // 채널별 조회
    for (const ch of channels) {
      const cd = (CI.by_channel || {})[ch];
      if (!cd) continue;
      for (const m of months) {
        const d = cd[m];
        if (d) rows.push({ 채널: ch, 연도: m.slice(0,4), 월: parseInt(m.slice(4)),
          RN: d.rn, "ADR(천원)": d.adr, "매출(백만원)": d.rev });
      }
    }
    if (rows.length === 0) return { error: "해당 채널의 데이터가 없습니다." };
    const label = channels.join(", ");
    return buildResult(rows, `채널_${label}`, `${label} · ${monthLabel}`, parsed,
      ["채널","연도","월","RN","ADR(천원)","매출(백만원)"]);
  }

  // ── 사업장별 조회 (목표/FCST/LY/YoY 포함) ──
  const targetSegs = segments.includes("전체") ? ["OTA","G-OTA","Inbound"] : segments;
  const bf = CI.budget_fcst || {};
  const is2026 = months.some(m => m.startsWith("2026"));

  if (isTotal) {
    for (const seg of targetSegs) {
      const segData = CI.totals[seg] || {};
      for (const m of months) {
        const d = segData[m];
        if (d) {
          const row = { 사업장: "전사 합계", 세그먼트: seg, 연도: m.slice(0,4), 월: parseInt(m.slice(4)),
            RN: d.rn, "ADR(천원)": d.adr, "매출(백만원)": d.rev };
          // LY (전년 동월)
          const lyMonth = String(parseInt(m.slice(0,4))-1) + m.slice(4);
          const lyData = segData[lyMonth];
          if (lyData) {
            row["LY_RN"] = lyData.rn;
            row["YoY(%)"] = lyData.rn > 0 ? Math.round((d.rn - lyData.rn) / lyData.rn * 1000) / 10 : null;
          }
          rows.push(row);
        }
      }
    }
  } else {
    for (const prop of properties) {
      const propData = CI.data[prop];
      if (!propData) continue;
      const propBF = bf[prop] || {};
      for (const seg of targetSegs) {
        const segData = propData[seg] || {};
        for (const m of months) {
          const d = segData[m];
          if (d) {
            const row = { 사업장: prop, 세그먼트: seg, 연도: m.slice(0,4), 월: parseInt(m.slice(4)),
              RN: d.rn, "ADR(천원)": d.adr, "매출(백만원)": d.rev };
            // 목표/FCST (2026 전체 세그먼트 한정)
            if (m.startsWith("2026") && seg === targetSegs[0] && targetSegs.length === 1 || segments.includes("전체")) {
              const bfm = propBF[m];
              if (bfm) {
                row["목표_RN"] = bfm.bud || null;
                row["FCST_RN"] = bfm.fcst || null;
                row["FCST출처"] = bfm.fcst_src || null;
              }
            }
            // LY (전년 동월)
            const lyMonth = String(parseInt(m.slice(0,4))-1) + m.slice(4);
            const lyData = segData[lyMonth];
            if (lyData) {
              row["LY_RN"] = lyData.rn;
              row["YoY(%)"] = lyData.rn > 0 ? Math.round((d.rn - lyData.rn) / lyData.rn * 1000) / 10 : null;
            } else {
              // 전체 세그먼트에서 LY 찾기
              const allData = propData["전체"] || {};
              const lyAll = allData[lyMonth];
              const tyAll = allData[m];
              if (lyAll && tyAll && seg === targetSegs[0] && targetSegs.length === 1) {
                row["LY_RN"] = lyAll.rn;
                row["YoY(%)"] = lyAll.rn > 0 ? Math.round((tyAll.rn - lyAll.rn) / lyAll.rn * 1000) / 10 : null;
              }
            }
            rows.push(row);
          }
        }
      }
    }
  }

  if (rows.length === 0) return { error: "해당 조건에 맞는 데이터가 없습니다." };

  // 컬럼 동적 결정
  const baseCols = ["사업장","세그먼트","연도","월","RN","ADR(천원)","매출(백만원)"];
  const extraCols = [];
  if (rows.some(r => r["목표_RN"])) extraCols.push("목표_RN");
  if (rows.some(r => r["FCST_RN"])) extraCols.push("FCST_RN","FCST출처");
  if (rows.some(r => r["LY_RN"])) extraCols.push("LY_RN");
  if (rows.some(r => r["YoY(%)"] !== undefined && r["YoY(%)"] !== null)) extraCols.push("YoY(%)");

  const propLabel = isTotal ? "전사" : properties.map(p => p.replace(/\s/g,"")).join("_");
  const segLabel = segments.join("_");
  const summary = `${isTotal ? "전사" : properties.join(", ")} · ${segments.join(", ")} · ${monthLabel}`;

  return buildResult(rows, `${propLabel}_${segLabel}`, summary, parsed, [...baseCols, ...extraCols]);
}

function buildResult(rows, nameTag, summary, parsed, cols) {
  const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
  return { rows, filename: `GS_실적_${nameTag}_${dateStr}.xlsx`, summary, parsed, cols };
}

// ═══════════════════════════════════════════════
// 결과 표시
// ═══════════════════════════════════════════════

function showResultMsg(result, parsed) {
  const { rows, filename, summary, cols } = result;
  const numCols = new Set(["RN","ADR(천원)","매출(백만원)","연도","월","목표_RN","FCST_RN","LY_RN","YoY(%)"]);

  let tableHtml = '<div class="preview-wrap"><table class="pv-table"><thead><tr>';
  cols.forEach(c => { tableHtml += `<th${numCols.has(c)?' class="num"':''}>${esc(c)}</th>`; });
  tableHtml += '</tr></thead><tbody>';

  rows.forEach(row => {
    tableHtml += '<tr>';
    cols.forEach(c => {
      const v = row[c];
      if (c === "YoY(%)") {
        const cls = v > 0 ? "num pos" : v < 0 ? "num neg" : "num";
        tableHtml += `<td class="${cls}">${v !== null && v !== undefined ? (v > 0 ? "+" : "") + v + "%" : "-"}</td>`;
      } else if (numCols.has(c)) {
        tableHtml += `<td class="num">${v !== null && v !== undefined ? (typeof v === "number" ? v.toLocaleString("ko-KR") : v) : "-"}</td>`;
      } else {
        tableHtml += `<td>${v ? esc(String(v)) : "-"}</td>`;
      }
    });
    tableHtml += '</tr>';
  });

  // 합계행 (RN/매출)
  if (rows.length > 1) {
    let totalRN = 0, totalRev = 0;
    rows.forEach(r => { totalRN += r.RN || r["RN"] || 0; totalRev += r["매출(백만원)"] || 0; });
    const totalADR = totalRN > 0 ? Math.round(totalRev * 1_000_000 / totalRN / 1000) : 0;
    tableHtml += '<tr class="row-total">';
    cols.forEach(c => {
      if (c === cols[0]) tableHtml += '<td>합계</td>';
      else if (c === "RN") tableHtml += `<td class="num">${totalRN.toLocaleString("ko-KR")}</td>`;
      else if (c === "ADR(천원)") tableHtml += `<td class="num">${totalADR.toLocaleString("ko-KR")}</td>`;
      else if (c === "매출(백만원)") tableHtml += `<td class="num">${(Math.round(totalRev*100)/100).toLocaleString("ko-KR")}</td>`;
      else tableHtml += '<td>-</td>';
    });
    tableHtml += '</tr>';
  }

  tableHtml += '</tbody></table></div>';
  tableHtml += `<div class="pv-count">${esc(summary)} — ${rows.length}건</div>`;

  const blob = buildExcelBlob(result);
  const url = URL.createObjectURL(blob);
  const dlHtml = `<a class="dl-btn" href="${url}" download="${esc(filename)}">` +
    `<svg class="dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">` +
    `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>` +
    `${esc(filename)}</a>`;

  addBotMsg(tableHtml + dlHtml);
}

function buildExcelBlob(result) {
  const wb = XLSX.utils.book_new();
  // 엑셀용 데이터 (cols 순서)
  const sheetData = result.rows.map(r => {
    const obj = {};
    result.cols.forEach(c => { obj[c] = r[c] !== undefined ? r[c] : null; });
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(sheetData);
  ws["!cols"] = result.cols.map(c => ({ wch: c.length > 8 ? c.length + 4 : 12 }));
  XLSX.utils.book_append_sheet(wb, ws, "실적데이터");

  const p = result.parsed;
  const info = [
    { 항목: "조회일시", 내용: new Date().toLocaleString("ko-KR") },
    { 항목: "조회유형", 내용: p.queryType === "nationality" ? "국적별" : p.queryType === "channel" ? "채널별" : "사업장별" },
    { 항목: "대상", 내용: p.queryType === "nationality" ? p.nationalities.join(", ") : p.queryType === "channel" ? p.channels.join(", ") : (p.isTotal ? "전사" : p.properties.join(", ")) },
    { 항목: "세그먼트", 내용: p.segments.join(", ") },
    { 항목: "기간", 내용: p.monthLabel },
    { 항목: "건수", 내용: result.rows.length + "건" },
    { 항목: "기준", 내용: "예약일(Booking Date) 기준 · Net RN" },
    { 항목: "단위", 내용: "RN=실, ADR=천원, 매출=백만원" },
  ];
  const ws2 = XLSX.utils.json_to_sheet(info);
  ws2["!cols"] = [{ wch: 12 }, { wch: 60 }];
  XLSX.utils.book_append_sheet(wb, ws2, "조회조건");

  const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  return new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
