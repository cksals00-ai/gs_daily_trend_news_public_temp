<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GS 세일즈 데이터 조회</title>
<meta name="theme-color" content="#0f1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0f1117;--bg2:#161921;--bg3:#1c1f2a;--bg4:#242836;
  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.07);--glass3:rgba(255,255,255,.10);
  --ink:#f0f0f4;--ink2:#c8cad0;--ink3:#8b8f9a;--ink4:#5c6070;
  --gold:#d4a74a;--gold2:#ecc06a;--gold3:#f5d98a;--gold-glow:rgba(212,167,74,.15);
  --rose:#e87a8a;--violet:#a07ee8;--cyan:#5cc4d0;--mint:#5cc49a;
  --rule:rgba(255,255,255,.08);
  --sans:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,sans-serif;
  --mono:'JetBrains Mono','D2Coding',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.6}

/* ─── TOP BAR ─── */
.top-bar{
  background:var(--bg);border-bottom:1px solid var(--rule);
  padding:0 24px;height:48px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.top-brand{font-size:13px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:8px}
.top-brand-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
.top-back{
  font-size:12px;color:var(--ink3);text-decoration:none;
  padding:5px 12px;border:1px solid var(--rule);border-radius:16px;transition:all .2s;
}
.top-back:hover{color:var(--gold2);border-color:var(--gold)}

/* ─── LAYOUT ─── */
.page{max-width:1100px;margin:0 auto;padding:24px 20px 60px}

/* ─── HEADER ─── */
.page-header{margin-bottom:28px}
.page-header h1{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:4px}
.page-header p{font-size:13px;color:var(--ink3)}

/* ─── FILTER PANEL ─── */
.filter-panel{
  background:var(--bg2);border:1px solid var(--rule);border-radius:14px;
  padding:20px 24px 16px;margin-bottom:24px;
}
.filter-grid{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:16px 20px;
  margin-bottom:16px;
}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-label{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
.filter-label .sub{font-weight:400;color:var(--ink4);margin-left:4px}

.filter-select, .filter-month{
  background:var(--bg3);border:1px solid var(--rule);border-radius:8px;
  color:var(--ink);font-family:var(--sans);font-size:13px;
  padding:8px 12px;outline:none;cursor:pointer;transition:border-color .2s;
  -webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238b8f9a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;
  padding-right:32px;
}
.filter-select:focus, .filter-month:focus{border-color:var(--gold)}
.filter-select option{background:var(--bg3);color:var(--ink)}

.filter-range{display:flex;align-items:center;gap:6px}
.filter-range .sep{color:var(--ink4);font-size:12px;flex-shrink:0}

.filter-disabled{
  position:relative;
}
.filter-disabled .filter-select{opacity:.35;pointer-events:none}
.filter-disabled .badge-na{
  position:absolute;top:0;right:0;
  font-size:10px;background:var(--bg4);color:var(--ink4);
  padding:2px 8px;border-radius:0 8px 0 8px;letter-spacing:.02em;
}

/* ─── ACTION BAR ─── */
.action-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 20px;border-radius:10px;border:none;
  font-family:var(--sans);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.btn-primary{background:var(--gold);color:#111}
.btn-primary:hover{background:var(--gold2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:transparent;border:1px solid var(--rule);color:var(--ink2)}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold2)}
.btn-secondary:disabled{opacity:.3;cursor:not-allowed}
.btn-icon{width:16px;height:16px;flex-shrink:0}
.action-info{font-size:12px;color:var(--ink4);margin-left:auto}

/* ─── RESULT AREA ─── */
.result-area{display:none}
.result-area.show{display:block}

.result-summary{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  margin-bottom:12px;
}
.result-count{font-size:13px;color:var(--ink2)}
.result-count strong{color:var(--gold2);font-weight:700}

/* ─── TABLE ─── */
.table-wrap{
  overflow-x:auto;border:1px solid var(--rule);border-radius:12px;
  background:var(--bg2);
}
.table-wrap::-webkit-scrollbar{height:6px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--ink4);border-radius:3px}

.data-table{
  width:100%;border-collapse:collapse;font-size:13px;
  white-space:nowrap;
}
.data-table thead{position:sticky;top:0;z-index:2}
.data-table th{
  background:var(--bg3);color:var(--ink3);font-weight:600;
  padding:10px 14px;text-align:left;border-bottom:1px solid var(--rule);
  font-size:12px;letter-spacing:.02em;
}
.data-table th.num{text-align:right}
.data-table td{
  padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);
  color:var(--ink2);
}
.data-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.data-table tbody tr:hover{background:var(--glass)}
.data-table tbody tr:last-child td{border-bottom:none}

/* 합계 행 */
.data-table tr.row-total td{
  background:rgba(212,167,74,.06);color:var(--gold2);font-weight:600;
  border-top:1px solid rgba(212,167,74,.2);
}

/* ─── EMPTY ─── */
.empty-state{
  text-align:center;padding:48px 20px;color:var(--ink4);font-size:14px;
}

/* ─── LOADING ─── */
.loading-overlay{
  position:fixed;inset:0;background:rgba(15,17,23,.7);z-index:200;
  display:none;align-items:center;justify-content:center;
}
.loading-overlay.show{display:flex}
.spinner{width:32px;height:32px;border:3px solid var(--rule);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── RESPONSIVE ─── */
@media(max-width:600px){
  .page{padding:16px 12px 40px}
  .filter-panel{padding:16px}
  .filter-grid{grid-template-columns:1fr}
  .action-bar{flex-direction:column;align-items:stretch}
  .action-info{margin-left:0;text-align:center}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-brand"><span class="top-brand-dot"></span>GS DATA QUERY</div>
  <a class="top-back" href="gs-sales.html">Sales Home</a>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<div class="page">

  <!-- HEADER -->
  <div class="page-header">
    <h1>세일즈 데이터 조회</h1>
    <p>필터를 선택하고 조회 버튼을 누르면 프리뷰가 표시됩니다. 엑셀 다운로드도 가능합니다.</p>
  </div>

  <!-- FILTER PANEL -->
  <div class="filter-panel">
    <div class="filter-grid">

      <!-- 예약일 기간 -->
      <div class="filter-group">
        <div class="filter-label">예약일 기간</div>
        <div class="filter-range">
          <select class="filter-select" id="bookFrom"></select>
          <span class="sep">~</span>
          <select class="filter-select" id="bookTo"></select>
        </div>
      </div>

      <!-- 투숙일 기간 -->
      <div class="filter-group filter-disabled">
        <div class="filter-label">투숙일 기간 <span class="sub">(데이터 미지원)</span></div>
        <div class="filter-range">
          <select class="filter-select" disabled><option>-</option></select>
          <span class="sep">~</span>
          <select class="filter-select" disabled><option>-</option></select>
        </div>
        <span class="badge-na">미지원</span>
      </div>

      <!-- 사업장 -->
      <div class="filter-group">
        <div class="filter-label">사업장</div>
        <select class="filter-select" id="property"></select>
      </div>

      <!-- 채널(세그먼트) -->
      <div class="filter-group">
        <div class="filter-label">채널 (세그먼트)</div>
        <select class="filter-select" id="segment">
          <option value="전체">전체</option>
          <option value="OTA">OTA</option>
          <option value="G-OTA">G-OTA</option>
          <option value="Inbound">Inbound</option>
        </select>
      </div>

      <!-- 국적 -->
      <div class="filter-group filter-disabled">
        <div class="filter-label">국적 <span class="sub">(데이터 미지원)</span></div>
        <select class="filter-select" disabled><option>-</option></select>
        <span class="badge-na">미지원</span>
      </div>

    </div>

    <!-- ACTION BAR -->
    <div class="action-bar">
      <button class="btn btn-primary" id="btnSearch" disabled>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        조회
      </button>
      <button class="btn btn-secondary" id="btnDownload" disabled>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        엑셀 다운로드
      </button>
      <span class="action-info" id="actionInfo">읽기 전용 · OTA / G-OTA / Inbound 세그먼트 한정</span>
    </div>
  </div>

  <!-- RESULT -->
  <div class="result-area" id="resultArea">
    <div class="result-summary">
      <span class="result-count" id="resultCount"></span>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- EMPTY STATE (before first search) -->
  <div class="empty-state" id="emptyState">
    필터를 선택하고 <strong>조회</strong> 버튼을 눌러주세요.
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   GS 세일즈 데이터 조회 — 필터 → 프리뷰 → 엑셀 다운로드
   ═══════════════════════════════════════════════════════════ */

let CI = null;           // chat_index.json
let currentRows = null;  // 현재 조회 결과
let currentMeta = null;  // 현재 조회 조건 메타

// ── DOM ──
const elBookFrom  = document.getElementById("bookFrom");
const elBookTo    = document.getElementById("bookTo");
const elProperty  = document.getElementById("property");
const elSegment   = document.getElementById("segment");
const elBtnSearch = document.getElementById("btnSearch");
const elBtnDl     = document.getElementById("btnDownload");
const elResult    = document.getElementById("resultArea");
const elEmpty     = document.getElementById("emptyState");
const elCount     = document.getElementById("resultCount");
const elTHead     = document.getElementById("tableHead");
const elTBody     = document.getElementById("tableBody");
const elLoading   = document.getElementById("loading");

// ── 초기화 ──
(async function init() {
  try {
    elLoading.classList.add("show");
    const r = await fetch("data/chat_index.json");
    if (!r.ok) throw new Error("HTTP " + r.status);
    CI = await r.json();
    populateFilters();
    elBtnSearch.disabled = false;
    console.log("[query] loaded:", CI.properties.length, "properties,", CI.months.length, "months");
  } catch (e) {
    console.error("[query] load fail:", e);
    elEmpty.innerHTML = '데이터 로드 실패. 페이지를 새로고침해 주세요.';
  } finally {
    elLoading.classList.remove("show");
  }
})();

// ── 필터 채우기 ──
function populateFilters() {
  // 연월 옵션 생성
  const months = CI.months;
  const monthOpts = months.map(m => {
    const y = m.slice(0, 4);
    const mo = parseInt(m.slice(4));
    return { value: m, label: `${y}년 ${mo}월` };
  });

  // 예약일 From: 기본값 올해 1월
  const thisYear = new Date().getFullYear().toString();
  const defaultFrom = months.find(m => m.startsWith(thisYear)) || months[0];
  const defaultTo = months[months.length - 1];

  fillSelect(elBookFrom, monthOpts, defaultFrom);
  fillSelect(elBookTo, monthOpts, defaultTo);

  // 사업장
  const propOpts = [{ value: "__ALL__", label: "전사 합계" }];
  CI.properties.forEach(p => propOpts.push({ value: p, label: p }));
  fillSelect(elProperty, propOpts, "__ALL__");
}

function fillSelect(el, options, defaultVal) {
  el.innerHTML = "";
  options.forEach(o => {
    const opt = document.createElement("option");
    opt.value = o.value;
    opt.textContent = o.label;
    if (o.value === defaultVal) opt.selected = true;
    el.appendChild(opt);
  });
}

// ── 이벤트 ──
elBtnSearch.addEventListener("click", doSearch);
elBtnDl.addEventListener("click", doDownload);

// ── 조회 ──
function doSearch() {
  if (!CI) return;

  const from = elBookFrom.value;
  const to = elBookTo.value;
  const prop = elProperty.value;
  const seg = elSegment.value;

  // 기간 유효성
  if (from > to) {
    alert("시작 기간이 종료 기간보다 늦습니다.");
    return;
  }

  // 해당 기간 월 목록
  const months = CI.months.filter(m => m >= from && m <= to);
  if (months.length === 0) {
    alert("선택한 기간에 데이터가 없습니다.");
    return;
  }

  const isTotal = prop === "__ALL__";
  const segments = seg === "전체" ? ["OTA", "G-OTA", "Inbound"] : [seg];
  const rows = [];

  if (isTotal) {
    // 전사 합계
    for (const s of segments) {
      const segData = CI.totals[s] || {};
      for (const m of months) {
        const d = segData[m];
        if (!d) continue;
        rows.push(makeRow("전사 합계", s, m, d));
      }
    }
    // 전체 세그먼트 선택 시 세그먼트 소계도 추가
    if (seg === "전체") {
      for (const m of months) {
        const d = (CI.totals["전체"] || {})[m];
        if (d) rows.push(makeRow("전사 합계", "소계", m, d));
      }
    }
  } else {
    // 개별 사업장
    const propData = CI.data[prop];
    if (!propData) { showEmpty("해당 사업장 데이터가 없습니다."); return; }
    for (const s of segments) {
      const segData = propData[s] || {};
      for (const m of months) {
        const d = segData[m];
        if (!d) continue;
        rows.push(makeRow(prop, s, m, d));
      }
    }
    if (seg === "전체") {
      for (const m of months) {
        const d = (propData["전체"] || {})[m];
        if (d) rows.push(makeRow(prop, "소계", m, d));
      }
    }
  }

  if (rows.length === 0) {
    showEmpty("해당 조건에 맞는 데이터가 없습니다.");
    return;
  }

  currentRows = rows;
  currentMeta = {
    property: isTotal ? "전사 합계" : prop,
    segment: seg,
    fromLabel: formatMonth(from),
    toLabel: formatMonth(to),
    count: rows.length,
  };

  renderTable(rows);
  elResult.classList.add("show");
  elEmpty.style.display = "none";
  elBtnDl.disabled = false;
  elCount.innerHTML = `<strong>${currentMeta.property}</strong> · ${currentMeta.segment} · ${currentMeta.fromLabel} ~ ${currentMeta.toLabel} — <strong>${rows.length}건</strong>`;
}

function makeRow(prop, seg, m, d) {
  return {
    사업장: prop,
    세그먼트: seg,
    연도: m.slice(0, 4),
    월: parseInt(m.slice(4)),
    RN: d.rn,
    "ADR(천원)": d.adr,
    "매출(백만원)": d.rev,
  };
}

function formatMonth(m) {
  return m.slice(0, 4) + "년 " + parseInt(m.slice(4)) + "월";
}

function showEmpty(msg) {
  currentRows = null;
  currentMeta = null;
  elResult.classList.remove("show");
  elEmpty.style.display = "block";
  elEmpty.innerHTML = msg;
  elBtnDl.disabled = true;
}

// ── 테이블 렌더링 ──
function renderTable(rows) {
  const cols = ["사업장", "세그먼트", "연도", "월", "RN", "ADR(천원)", "매출(백만원)"];
  const numCols = new Set(["RN", "ADR(천원)", "매출(백만원)", "연도", "월"]);

  // thead
  elTHead.innerHTML = `<tr>${cols.map(c =>
    `<th${numCols.has(c) ? ' class="num"' : ''}>${esc(c)}</th>`
  ).join("")}</tr>`;

  // tbody
  const frag = document.createDocumentFragment();

  // 합계 계산용
  let totalRN = 0, totalRev = 0;
  const dataRows = rows.filter(r => r.세그먼트 !== "소계");

  for (const row of rows) {
    const tr = document.createElement("tr");
    if (row.세그먼트 === "소계") tr.className = "row-total";
    for (const c of cols) {
      const td = document.createElement("td");
      const v = row[c];
      if (numCols.has(c)) {
        td.className = "num";
        td.textContent = typeof v === "number" ? v.toLocaleString("ko-KR") : v;
      } else {
        td.textContent = v;
      }
      tr.appendChild(td);
    }
    frag.appendChild(tr);

    if (row.세그먼트 !== "소계") {
      totalRN += row.RN || 0;
      totalRev += row["매출(백만원)"] || 0;
    }
  }

  // 최종 합계 행 (소계가 없을 때만)
  const hasSubtotal = rows.some(r => r.세그먼트 === "소계");
  if (!hasSubtotal && rows.length > 1) {
    const tr = document.createElement("tr");
    tr.className = "row-total";
    const totalADR = totalRN > 0 ? Math.round(totalRev * 1000000 / totalRN / 1000) : 0;
    const vals = ["합계", "-", "-", "-", totalRN, totalADR, Math.round(totalRev * 100) / 100];
    for (let i = 0; i < cols.length; i++) {
      const td = document.createElement("td");
      if (numCols.has(cols[i])) {
        td.className = "num";
        td.textContent = typeof vals[i] === "number" ? vals[i].toLocaleString("ko-KR") : vals[i];
      } else {
        td.textContent = vals[i];
      }
      tr.appendChild(td);
    }
    frag.appendChild(tr);
  }

  elTBody.innerHTML = "";
  elTBody.appendChild(frag);
}

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ── 엑셀 다운로드 ──
function doDownload() {
  if (!currentRows || currentRows.length === 0) return;

  const wb = XLSX.utils.book_new();

  // 메인 시트
  const ws = XLSX.utils.json_to_sheet(currentRows);
  ws["!cols"] = [
    { wch: 22 }, { wch: 10 }, { wch: 6 }, { wch: 4 },
    { wch: 12 }, { wch: 14 }, { wch: 16 },
  ];
  XLSX.utils.book_append_sheet(wb, ws, "실적데이터");

  // 조회조건 시트
  const info = [
    { 항목: "조회일시", 내용: new Date().toLocaleString("ko-KR") },
    { 항목: "사업장", 내용: currentMeta.property },
    { 항목: "세그먼트", 내용: currentMeta.segment },
    { 항목: "예약일 기간", 내용: currentMeta.fromLabel + " ~ " + currentMeta.toLabel },
    { 항목: "데이터건수", 내용: currentMeta.count + "건" },
    { 항목: "비고", 내용: "RN=Net RN, ADR=천원, 매출=백만원 (세그먼트: OTA/G-OTA/Inbound)" },
  ];
  const ws2 = XLSX.utils.json_to_sheet(info);
  ws2["!cols"] = [{ wch: 12 }, { wch: 60 }];
  XLSX.utils.book_append_sheet(wb, ws2, "조회조건");

  const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);

  const propSlug = currentMeta.property.replace(/\s/g, "");
  const segSlug = currentMeta.segment.replace(/\s/g, "");
  const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, "");
  const filename = `GS_실적_${propSlug}_${segSlug}_${dateStr}.xlsx`;

  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
</script>
</body>
</html>
