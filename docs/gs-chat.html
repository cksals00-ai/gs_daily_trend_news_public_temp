:root{

  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.07);--glass3:rgba(255,255,255,.10);
  --ink:#f0f0f4;--ink2:#c8cad0;--ink3:#8b8f9a;--ink4:#5c6070;
  --gold:#d4a74a;--gold2:#ecc06a;--gold3:#f5d98a;--gold-glow:rgba(212,167,74,.15);
  --rose:#e87a8a;--violet:#a07ee8;--cyan:#5cc4d0;--mint:#5cc49a;
  --rule:rgba(255,255,255,.08);
  --sans:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,sans-serif;
  --mono:'JetBrains Mono','D2Coding',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.top-bar{background:var(--bg);border-bottom:1px solid var(--rule);padding:0 24px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top-brand{font-size:12px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:10px;letter-spacing:.06em;font-family:var(--mono,'JetBrains Mono',monospace)}
.top-back{font-size:12px;color:var(--ink3);text-decoration:none;padding:5px 12px;border:1px solid var(--rule);border-radius:16px;transition:all .2s}
.top-back:hover{color:var(--gold2);border-color:var(--gold)}
.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:960px;width:100%;margin:0 auto;padding:0 16px;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:24px 0 16px;display:flex;flex-direction:column;gap:16px}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:var(--ink4);border-radius:4px}
.msg{max-width:96%;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-user{align-self:flex-end}
.msg-bot{align-self:flex-start}
.msg-bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.65;word-break:keep-all}
.msg-user .msg-bubble{background:var(--gold);color:#111;border-bottom-right-radius:4px;font-weight:500}
.msg-bot .msg-bubble{background:var(--bg3);color:var(--ink);border-bottom-left-radius:4px;border:1px solid var(--rule)}
.preview-wrap{margin-top:12px;overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--bg2);max-height:420px;overflow-y:auto}
.preview-wrap::-webkit-scrollbar{width:4px;height:4px}
.preview-wrap::-webkit-scrollbar-thumb{background:var(--ink4);border-radius:3px}
.pv-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.pv-table th{background:var(--bg4);color:var(--ink3);font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:1;font-size:11px;letter-spacing:.02em}
.pv-table th.num{text-align:right}
.pv-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--ink2)}
.pv-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.pv-table tbody tr:hover{background:var(--glass)}
.pv-table tr.row-total td{background:rgba(212,167,74,.06);color:var(--gold2);font-weight:600;border-top:1px solid rgba(212,167,74,.2)}
.pv-table td.pos{color:var(--mint)}
.pv-table td.neg{color:var(--rose)}
.pv-count{font-size:11px;color:var(--ink4);margin-top:6px}
.insight-box{margin-top:12px;padding:10px 14px;border-radius:10px;background:rgba(212,167,74,.06);border:1px solid rgba(212,167,74,.15);font-size:13px;line-height:1.7;color:var(--ink2)}
.insight-box b{color:var(--gold2)}
.chart-wrap{margin-top:12px;border:1px solid var(--rule);border-radius:10px;background:var(--bg2);padding:16px;overflow-x:auto}
.chart-wrap canvas{max-width:100%;height:200px}
.dl-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 16px;border-radius:10px;border:1px solid var(--gold);background:rgba(212,167,74,.12);color:var(--gold2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none}
.dl-btn:hover{background:rgba(212,167,74,.25);color:var(--gold3)}
.dl-icon{width:16px;height:16px}
/* ── Welcome Hero ── */
@keyframes welcomeFadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes glowPulse{0%,100%{opacity:.4}50%{opacity:.7}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.welcome{text-align:center;padding:56px 24px 32px;position:relative;animation:welcomeFadeIn .7s ease both}
.welcome::before{content:'';position:absolute;top:20%;left:50%;transform:translateX(-50%);width:260px;height:260px;background:radial-gradient(circle,rgba(212,167,74,.08) 0%,transparent 70%);border-radius:50%;pointer-events:none;animation:glowPulse 4s ease-in-out infinite}
.welcome-icon{display:flex;align-items:center;justify-content:center;margin:0 auto 20px;width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,rgba(212,167,74,.15),rgba(212,167,74,.05));border:1px solid rgba(212,167,74,.2);animation:floatUp 3s ease-in-out infinite;position:relative}
.welcome-icon svg{width:28px;height:28px}
.welcome-icon::after{content:'';position:absolute;inset:-1px;border-radius:16px;background:linear-gradient(135deg,rgba(212,167,74,.3),transparent 60%);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;-webkit-mask-composite:xor;padding:1px;pointer-events:none}
.welcome h2{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;background:linear-gradient(135deg,var(--gold2) 0%,var(--gold3) 40%,var(--gold) 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite}
.welcome-sub{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(212,167,74,.1);border:1px solid rgba(212,167,74,.15);border-radius:20px;padding:4px 14px;margin-bottom:16px}
.welcome p{font-size:14px;color:var(--ink3);line-height:1.7;margin-bottom:28px;max-width:420px;margin-left:auto;margin-right:auto}
.welcome-divider{width:40px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 24px;border-radius:1px}
.templates{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px;margin:0 auto}
.tpl-btn{padding:10px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink2);font-size:13px;cursor:pointer;transition:all .25s ease;font-family:var(--sans);font-weight:500;position:relative;overflow:hidden}
.tpl-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);pointer-events:none}
.tpl-btn:hover{border-color:rgba(212,167,74,.35);color:var(--gold2);background:rgba(212,167,74,.08);transform:translateY(-1px);box-shadow:0 4px 16px rgba(212,167,74,.12)}
.input-area{flex-shrink:0;padding:12px 0 20px;border-top:1px solid var(--rule)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-field{flex:1;resize:none;border:1px solid var(--rule);border-radius:14px;background:var(--bg2);color:var(--ink);font-family:var(--sans);font-size:14px;padding:12px 16px;outline:none;min-height:46px;max-height:100px;line-height:1.5;transition:border-color .2s}
.input-field:focus{border-color:var(--gold)}
.input-field::placeholder{color:var(--ink4)}
.send-btn{width:46px;height:46px;border-radius:14px;border:none;background:var(--gold);color:#111;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.send-btn:hover{background:var(--gold2)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.send-icon{width:20px;height:20px}
.typing{display:flex;gap:4px;padding:8px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:bounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{transform:translateY(-6px);opacity:.4}}
.footer-note{text-align:center;font-size:11px;color:var(--ink4);padding:0 0 12px}

  const m = {};
  const add = (keys, val) => keys.forEach(k => { m[k.replace(/[-_\s]/g,"").toLowerCase()] = val; });
  add(["ota","OTA","오타"], "OTA");
  add(["g-ota","G-OTA","gota","GOTA","g ota","G OTA","g_ota","G_OTA","글로벌ota","글로벌OTA","글로벌 ota","지오타","지OTA","글로벌"], "G-OTA");
  add(["inbound","Inbound","INBOUND","인바운드","IB","ib"], "Inbound");
  add(["전체","전세그먼트","모든세그먼트","합계"], "전체");
  return m;
})();

// ═══════════════════════════════════════════════
// 메인 처리
// ═══════════════════════════════════════════════

function processQuery(query) {
  if (!CI) { addBotMsg("데이터 로드 중..."); return; }
  isLoading = true; showTyping();

  setTimeout(() => {
    try {
      // ── 후속 질문 감지 ──
      const resolved = resolveFollowUp(query);

      // ── 전년 비교 (YoY) 감지 ──
      const yoyRe = /전년\s*(?:비교|대비)|yoy|YoY|작년\s*비교|올해\s*작년\s*비교|작년\s*올해\s*비교|올해\s*(?:vs|대비)\s*작년|작년\s*(?:vs|대비)\s*올해/i;
      if (yoyRe.test(resolved)) {
        // 기간 키워드 제거 후 기본 쿼리 추출
        const baseQ = resolved.replace(/전년\s*(?:비교|대비)|yoy|YoY|올해\s*작년\s*비교|작년\s*올해\s*비교|작년\s*비교|올해\s*(?:vs|대비)\s*작년|작년\s*(?:vs|대비)\s*올해/gi, "").trim();
        const ty = new Date().getFullYear();
        const ly = ty - 1;
        // 올해 월 범위 파악
        const tyMonths = (CI.months||[]).filter(m => m.startsWith(String(ty)));
        const tyMonthNums = tyMonths.map(m => parseInt(m.slice(4)));
        // 작년도 같은 월 범위만
        const lyMonths = tyMonthNums.map(n => String(ly)+String(n).padStart(2,"0")).filter(m => CI.months.includes(m));

        const r1 = runSingle((baseQ||"전사") + " " + ly + "년", resolved);
        const r2 = runSingle((baseQ||"전사") + " " + ty + "년", resolved);
        // 작년은 올해와 같은 월만 필터
        if (!r1.error && lyMonths.length) {
          r1.rows = r1.rows.filter(r => {
            const mk = r.연도+String(r.월).padStart(2,"0");
            return lyMonths.includes(mk);
          });
        }
        hideTyping();
        if (r1.error && r2.error) { addBotMsg(r1.error); }
        else if (r1.error) { addBotMsg(r1.error); }
        else if (r2.error) { addBotMsg(r2.error); }
        else {
          r1.summary = ly + "년 · " + r1.summary.replace(/\d{4}년[^·]*/,"").replace(/^·\s*/,"");
          r2.summary = ty + "년 · " + r2.summary.replace(/\d{4}년[^·]*/,"").replace(/^·\s*/,"");
          showCompareMsg([r1, r2], "yoy");
        }
        isLoading = false; return;
      }

      // ── 비교(vs) 감지 ──
      let vsItems = null;
      // "A vs B" or "A 대비 B"
      const vsMatch1 = resolved.match(/(.+?)\s*(?:vs|VS)\s*(.+)/);
      if (vsMatch1) vsItems = [vsMatch1[1].trim(), vsMatch1[2].trim()];
      // "A, B 비교" or "A B 비교" (끝에 비교)
      if (!vsItems) {
        const vsMatch2 = resolved.match(/^(.+?)\s*비교\s*$/);
        if (vsMatch2) {
          const inner = vsMatch2[1];
          // 쉼표 구분: "델피노 아고다, 여기어때 비교"
          if (inner.includes(",")) {
            vsItems = inner.split(",").map(s => s.trim()).filter(Boolean);
          }
          // 공백 구분: "여기어때 야놀자 비교" → 채널/사업장 자동 감지
          if (!vsItems) {
            const chs = findAllChannels(inner);
            if (chs.length >= 2) { vsItems = chs; }
            else {
              const props = findAllProperties(inner);
              if (props.length >= 2) { vsItems = props; }
            }
          }
        }
      }
      // "A 대비 B" (중간)
      if (!vsItems) {
        const vsMatch3 = resolved.match(/(.+?)\s*대비\s*(.+)/);
        if (vsMatch3) vsItems = [vsMatch3[1].trim(), vsMatch3[2].trim()];
      }
      if (vsItems && vsItems.length >= 2) {
        // 공통 사업장/기간 컨텍스트 추출
        const contextProps = findProperties(resolved);
        const contextMonths = parseMonths(resolved);
        const results = vsItems.map(item => {
          // 각 항목에 공통 컨텍스트 보충
          let enriched = item;
          if (contextProps.length && !findProperties(item).length) {
            enriched = contextProps.join(" ") + " " + item;
          }
          if (contextMonths && contextMonths.result && !/\d{4}|올해|작년|최근|상반기|하반기|이번|지난|월/.test(item)) {
            enriched = enriched + " " + (contextMonths.label || "");
          }
          return runSingle(enriched, resolved);
        });
        hideTyping();
        const errors = results.filter(r => r.error);
        if (errors.length) { addBotMsg(errors[0].error); }
        else { showCompareMsg(results); }
        isLoading = false; return;
      }

      // ── "채널별" 키워드 → 주요 채널 리스트 ──
      if (/채널\s*별/i.test(resolved) && !findChannels(resolved).length) {
        const parsed = parseQuery(resolved);
        if (!parsed.error) {
          hideTyping();
          showChannelBreakdown(parsed);
          isLoading = false; return;
        }
      }

      // ── 단일 쿼리 ──
      const result = runSingle(resolved, resolved);
      hideTyping();
      if (result.error) { addBotMsg(result.error); }
      else { showResultMsg(result); lastContext = result; }
    } catch (e) {
      console.error(e); hideTyping();
      addBotMsg("처리 중 오류: " + esc(e.message));
    }
    isLoading = false;
  }, 250);
}

// ── 후속 질문 해결 ──
function resolveFollowUp(q) {
  if (!lastContext) return q;
  const ql = q.toLowerCase();
  const followCues = ["그거","그걸","위에","방금","아까","거기서","이번에는","대신","으로"];
  const isFollow = followCues.some(c => ql.includes(c)) ||
    (q.length < 20 && !findProperties(q).length && !/\d{4}/.test(q));

  if (!isFollow) return q;

  // ★ 독립 질문 판별: "실적/현황/추이/매출" + (세그먼트 or 채널별) + 사업장 미지정 = 전사 기본
  const standaloneRe = /실적|현황|추이|매출|올해|rn|RN|객실|전체/;
  if (standaloneRe.test(q) && !findProperties(q).length) return q;

  // 이전 맥락에서 사업장/기간 가져오기
  const prev = lastContext.parsed;
  let resolved = q;

  // "채널별로 쪼개줘" → 이전 사업장 + 기간 유지
  if (/채널\s*별|채널로|세그.*별|세그로|ota만|gota만|인바운드만|국적별/.test(ql)) {
    const propPart = prev.isTotal ? "전사" : (prev.properties || []).join(" ");
    const monthPart = prev.monthLabel || "";
    resolved = propPart + " " + monthPart + " " + q;
  }
  // "OTA만 보여줘" → 이전 사업장 + 기간 + OTA
  else if (findSegments(q).length > 0 && !findProperties(q).length) {
    const propPart = prev.isTotal ? "전사" : (prev.properties || []).join(" ");
    const monthPart = prev.monthLabel || "";
    resolved = propPart + " " + monthPart + " " + q;
  }

  return resolved;
}

function runSingle(query, fullQuery) {
  const parsed = parseQuery(query);
  if (parsed.error) return { error: parsed.error };
  const result = extractData(parsed);
  if (result.error) return { error: result.error };
  result.parsed = parsed;
  return result;
}

// ═══════════════════════════════════════════════
// 파싱
// ═══════════════════════════════════════════════

function parseQuery(q) {
  const ql = q.toLowerCase().replace(/\s+/g, " ");

  // 0) 인플루언서 / 기획전 / 86코드 / 캠페인
  const isInfluencer = /인플루언서|인플\s|86코드|86code/i.test(q);
  const isCampaign = /기획전|캠페인|프로모션\s*실적|campaign/i.test(q) && !isInfluencer;
  if (isInfluencer || isCampaign) {
    const qType = isInfluencer ? "influencer" : "campaign";
    // 세부 키워드 추출
    let subQuery = "";
    if (/top|순위|랭킹|상위/i.test(q)) subQuery = "top";
    else if (/전환율|conversion/i.test(q)) subQuery = "conversion";
    else if (/사업장|property/i.test(q)) subQuery = "by_property";
    else if (/월별|monthly/i.test(q)) subQuery = "monthly";
    else if (/adr|단가/i.test(q)) subQuery = "adr";
    else subQuery = "summary";
    // 특정 인플루언서명 추출
    let targetInfluencer = null;
    const infNames = Object.keys((CI?.influencer?.by_influencer)||{});
    for (const name of infNames) {
      if (q.includes(name)) { targetInfluencer = name; break; }
    }
    // 사업장 필터
    let filterProp = findProperties(q);
    return { queryType:qType, subQuery, targetInfluencer, properties:filterProp,
      channels:[], nationalities:[], segments:[], months:[], isTotal:false };
  }

  // 1) 국적
  let nationalities = [];
  if (/동남아/i.test(q)) nationalities = SOUTHEAST_ASIA.filter(n => (CI.by_nationality||{})[n]);
  if (!nationalities.length) {
    for (const [a, nat] of Object.entries(NAT_ALIASES)) {
      if (ql.includes(a.toLowerCase()) && (CI.by_nationality||{})[nat] && !nationalities.includes(nat))
        nationalities.push(nat);
    }
  }
  if (nationalities.length) {
    const months = parseMonths(q);
    if (months.error) return { error: months.error };
    return { queryType:"nationality", nationalities, months:months.result, monthLabel:months.label,
      properties:[], channels:[], segments:["Inbound"], isTotal:false };
  }

  // 2) 채널 (+ 사업장 필터 가능)
  let channels = findChannels(q);
  if (channels.length) {
    const months = parseMonths(q);
    if (months.error) return { error: months.error };
    let chProps = findProperties(q);
    let chIsTotal = !chProps.length;
    return { queryType:"channel", channels, months:months.result, monthLabel:months.label,
      properties:chProps, nationalities:[], segments:[], isTotal:chIsTotal };
  }

  // 3) 사업장 + 세그먼트
  let properties = findProperties(q);
  let isTotal = /전사|전체\s*사업장|모든\s*사업장/i.test(q);

  // ★ 사업장 미지정 → 전사 기본
  if (!isTotal && properties.length === 0) isTotal = true;

  let segments = findSegments(q);
  if (!segments.length) segments = ["전체"];

  const months = parseMonths(q);
  if (months.error) return { error: months.error };

  return { queryType:"property", properties, segments, months:months.result, isTotal, monthLabel:months.label,
    channels:[], nationalities:[] };
}

function findProperties(q) {
  const ql = q.toLowerCase();
  let props = [];
  const propNames = (CI?.properties || []).slice().sort((a,b) => b.length - a.length);
  for (const p of propNames) { if (q.includes(p)) props.push(p); }
  if (!props.length) {
    const keys = Object.keys(PROP_ALIASES).sort((a,b) => b.length - a.length);
    for (const alias of keys) {
      if (ql.includes(alias.toLowerCase())) {
        props.push(...(PROP_ALIASES[alias] || []).filter(p => CI.properties.includes(p)));
        break; // 첫 매칭 그룹만 (중복 방지)
      }
    }
  }
  return [...new Set(props)];
}

function findChannels(q) {
  const ql = q.toLowerCase();
  let chs = [];
  for (const [a, ch] of Object.entries(CHANNEL_ALIASES)) {
    if (ql.includes(a.toLowerCase())) {
      const found = Object.keys(CI.by_channel||{}).find(c => c.includes(ch));
      if (found && !chs.includes(found)) chs.push(found);
    }
  }
  if (!chs.length) {
    const all = Object.keys(CI.by_channel||{}).sort((a,b) => b.length - a.length);
    for (const ch of all) {
      if (q.includes(ch) || ql.includes(ch.toLowerCase())) { chs.push(ch); break; }
    }
  }
  return chs;
}

// 비교용: 문자열에서 모든 채널 별칭 찾기 (각 채널명을 개별 반환)
function findAllChannels(q) {
  const ql = q.toLowerCase();
  let chs = [];
  for (const [a, ch] of Object.entries(CHANNEL_ALIASES)) {
    if (ql.includes(a.toLowerCase())) {
      const found = Object.keys(CI.by_channel||{}).find(c => c.includes(ch));
      if (found && !chs.includes(found)) chs.push(found);
    }
  }
  return chs;
}

// 비교용: 문자열에서 모든 사업장 별칭 찾기
function findAllProperties(q) {
  const ql = q.toLowerCase();
  let props = [];
  const keys = Object.keys(PROP_ALIASES).sort((a,b) => b.length - a.length);
  for (const alias of keys) {
    if (ql.includes(alias.toLowerCase())) {
      const matched = (PROP_ALIASES[alias]||[]).filter(p => CI.properties.includes(p));
      // 단일 사업장만 (그룹 별칭 제외)
      if (matched.length === 1 && !props.includes(matched[0])) props.push(matched[0]);
    }
  }
  return props;
}

function findSegments(q) {
  const qn = q.replace(/[-_\s]/g,"").toLowerCase();
  const found = [];
  for (const [key, seg] of Object.entries(SEG_NORM)) {
    if (qn.includes(key) && !found.includes(seg)) found.push(seg);
  }
  return found;
}

function parseMonths(q) {
  const now = new Date(), ty = now.getFullYear(), tm = now.getMonth()+1;
  const all = CI.months;

  // "최근 N개월"
  const recentMatch = q.match(/최근\s*(\d+)\s*개월/);
  if (recentMatch) {
    const n = parseInt(recentMatch[1]);
    const results = [];
    for (let i = 0; i < n; i++) {
      let y = ty, m = tm - i;
      while (m < 1) { m += 12; y--; }
      const k = String(y) + String(m).padStart(2,"0");
      if (all.includes(k)) results.unshift(k);
    }
    if (results.length) return { result: results, label: `최근 ${n}개월` };
  }

  // "상반기" / "하반기"
  if (/상반기/.test(q)) {
    const y = q.match(/(\d{4})/)?.[1] || String(ty);
    const f = all.filter(m => m.startsWith(y) && parseInt(m.slice(4)) <= 6);
    if (f.length) return { result: f, label: y + "년 상반기" };
  }
  if (/하반기/.test(q)) {
    const y = q.match(/(\d{4})/)?.[1] || String(ty);
    const f = all.filter(m => m.startsWith(y) && parseInt(m.slice(4)) >= 7);
    if (f.length) return { result: f, label: y + "년 하반기" };
  }

  // "YYYY년 M~M월"
  const rng = q.match(/(\d{4})\s*년\s*(\d{1,2})\s*월?\s*[~\-부터]\s*(\d{1,2})\s*월/);
  if (rng) {
    const [,y,m1,m2] = rng; const r = [];
    for (let m=parseInt(m1);m<=parseInt(m2);m++) { const k=y+String(m).padStart(2,"0"); if(all.includes(k))r.push(k); }
    if (r.length) return { result: r, label: `${y}년 ${m1}~${m2}월` };
  }

  // "YYYY년 M월" (복수)
  const ym = q.match(/(\d{4})\s*년\s*(\d{1,2})\s*월/g);
  if (ym) {
    const r = [];
    for (const m of ym) { const [,y,mo]=m.match(/(\d{4})\s*년\s*(\d{1,2})\s*월/); const k=y+String(mo).padStart(2,"0"); if(all.includes(k))r.push(k); }
    if (r.length) return { result: r, label: ym.join(", ") };
  }

  // "YYYY년"
  const yr = q.match(/(\d{4})\s*년/);
  if (yr) {
    const y = yr[1], f = all.filter(m => m.startsWith(y));
    if (f.length) return { result: f, label: y+"년" };
    return { error: `${y}년 데이터 없음` };
  }

  if (/올해|금년|이번\s*해/.test(q)) { const f=all.filter(m=>m.startsWith(String(ty))); if(f.length)return{result:f,label:ty+"년 (올해)"}; }
  if (/작년|전년|지난\s*해/.test(q)) { const y=String(ty-1),f=all.filter(m=>m.startsWith(y)); if(f.length)return{result:f,label:y+"년 (작년)"}; }
  if (/재작년|전전년/.test(q)) { const y=String(ty-2),f=all.filter(m=>m.startsWith(y)); if(f.length)return{result:f,label:y+"년 (재작년)"}; }
  if (/이번\s*달|이달|당월/.test(q)) { const k=String(ty)+String(tm).padStart(2,"0"); if(all.includes(k))return{result:[k],label:ty+"년 "+tm+"월"}; }
  if (/지난\s*달|전월/.test(q)) { let y=ty,m=tm-1; if(m<1){m=12;y--;} const k=String(y)+String(m).padStart(2,"0"); if(all.includes(k))return{result:[k],label:y+"년 "+m+"월"}; }

  const mo = q.match(/(\d{1,2})\s*월/);
  if (mo) { const m=parseInt(mo[1]); if(m>=1&&m<=12){ const k=String(ty)+String(m).padStart(2,"0"); if(all.includes(k))return{result:[k],label:ty+"년 "+m+"월"}; } }

  if (/yoy|전년\s*비교|동기간|전년\s*대비/i.test(q)) {
    const f=all.filter(m=>m.startsWith(String(ty))||m.startsWith(String(ty-1)));
    if(f.length)return{result:f,label:(ty-1)+"~"+ty+"년 (YoY)"};
  }

  // 기본: 올해
  const f = all.filter(m => m.startsWith(String(ty)));
  if (f.length) return { result: f, label: ty+"년 (기본)" };
  return { result: all, label: "전체 기간" };
}

// ═══════════════════════════════════════════════
// 데이터 추출
// ═══════════════════════════════════════════════

function extractData(parsed) {
  const { queryType, months, monthLabel } = parsed;
  let rows = [], cols = [], nameTag = "", summary = "";

  // ─ 인플루언서 ─
  if (queryType === "influencer") {
    const inf = CI.influencer;
    if (!inf) return { error: "인플루언서 데이터가 로드되지 않았습니다." };
    const { subQuery, targetInfluencer, properties } = parsed;

    if (targetInfluencer) {
      // 특정 인플루언서 상세
      const d = inf.by_influencer[targetInfluencer];
      if (!d) return { error: `"${targetInfluencer}" 인플루언서 데이터가 없습니다.` };
      rows.push({인플루언서:targetInfluencer, RN:d.rn, "객실매출(백만)":d.room_rev_m, "총매출(백만)":d.total_rev_m, "ADR(천원)":d.adr_k, 캠페인수:d.campaigns, 사업장:d.properties.join(", ")});
      // 해당 인플루언서의 캠페인 목록
      const camps = inf.campaigns.filter(c => c.influencer === targetInfluencer);
      camps.forEach(c => {
        rows.push({인플루언서:targetInfluencer+"_캠페인", 채널:c.channel, 사업장:c.property, RN:c.rn, "객실매출(백만)":c.room_rev_m, "ADR(천원)":c.adr_k, 판매기간:c.sale_period});
      });
      cols = ["인플루언서","채널","사업장","RN","객실매출(백만)","총매출(백만)","ADR(천원)","캠페인수","판매기간"];
      nameTag = "인플루언서_" + targetInfluencer;
      summary = `인플루언서 "${targetInfluencer}" 실적 (86코드 매핑)`;
    }
    else if (subQuery === "top" || subQuery === "summary") {
      // 인플루언서 전체 요약 + TOP
      const s = inf.summary;
      rows.push({구분:"전체 합계", RN:s.total_rn, "객실매출(백만)":s.total_room_rev_m, "총매출(백만)":s.total_rev_m, "평균ADR(천원)":s.avg_adr_k, 매칭캠페인수:s.campaigns_with_data});
      // 인플루언서별 순위
      const sorted = Object.entries(inf.by_influencer).sort((a,b) => b[1].rn - a[1].rn);
      sorted.forEach(([name, d], i) => {
        if (properties.length && !d.properties.some(p => properties.some(fp => p.includes(fp) || fp.includes(p)))) return;
        rows.push({구분:`#${i+1} ${name}`, RN:d.rn, "객실매출(백만)":d.room_rev_m, "총매출(백만)":d.total_rev_m, "평균ADR(천원)":d.adr_k, 매칭캠페인수:d.campaigns, 사업장:d.properties.join(", ")});
      });
      cols = ["구분","RN","객실매출(백만)","총매출(백만)","평균ADR(천원)","매칭캠페인수","사업장"];
      nameTag = "인플루언서_실적";
      summary = "인플루언서 실적 순위 (86코드 매핑 기준)";
    }
    else if (subQuery === "by_property") {
      Object.entries(inf.by_property).sort((a,b) => b[1].rn - a[1].rn).forEach(([prop, d]) => {
        rows.push({사업장:prop, RN:d.rn, "객실매출(백만)":d.room_rev_m, "총매출(백만)":d.total_rev_m, 캠페인수:d.campaigns});
      });
      cols = ["사업장","RN","객실매출(백만)","총매출(백만)","캠페인수"];
      nameTag = "인플루언서_사업장별";
      summary = "인플루언서 사업장별 실적";
    }
    else {
      // 기본: 캠페인 리스트
      inf.campaigns.forEach(c => {
        if (properties.length && !properties.some(p => c.property.includes(p) || p.includes(c.property))) return;
        rows.push({채널:c.channel, 사업장:c.property, 인플루언서:c.influencer||"-", RN:c.rn, "객실매출(백만)":c.room_rev_m, "ADR(천원)":c.adr_k, 판매기간:c.sale_period});
      });
      cols = ["채널","사업장","인플루언서","RN","객실매출(백만)","ADR(천원)","판매기간"];
      nameTag = "인플루언서_캠페인";
      summary = "인플루언서 캠페인별 실적";
    }
    if (!rows.length) return { error: "해당 조건의 인플루언서 데이터가 없습니다." };
    const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
    return { rows, cols, filename:`GS_${nameTag}_${dateStr}.xlsx`, summary, parsed };
  }

  // ─ 기획전 ─
  if (queryType === "campaign") {
    const camp = CI.campaign;
    if (!camp) return { error: "기획전 데이터가 로드되지 않았습니다." };
    const { subQuery } = parsed;
    // 채널별 기획전 요약
    const cs = camp.channel_summary || {};
    if (subQuery === "top") {
      // TOP 기획전 by key
      camp.top_campaigns.forEach((c,i) => {
        rows.push({순위:i+1, 기획전Key:c.key, RN:c.rn, "매출(백만)":c.rev_m, ADR:c.adr, "취소율(%)":c.cancel_rate});
      });
      cols = ["순위","기획전Key","RN","매출(백만)","ADR","취소율(%)"];
      nameTag = "기획전_TOP";
      summary = "기획전 실적 TOP (86코드 매핑 기준)";
    } else {
      // 채널별 요약
      Object.entries(cs).sort((a,b) => (b[1].total_rn||0) - (a[1].total_rn||0)).forEach(([ch, d]) => {
        rows.push({채널:ch, 기획전수:d.campaigns||0, 매칭수:d.matched||0, 총RN:d.total_rn||0, "PKG매출(백만)":d.pkg_rev_m||0, "객실매출(백만)":d.room_rev_m||0, 평균ADR:d.avg_adr||0, "캠페인당RN":d.avg_rn_per_campaign||0});
      });
      cols = ["채널","기획전수","매칭수","총RN","PKG매출(백만)","객실매출(백만)","평균ADR","캠페인당RN"];
      nameTag = "기획전_채널별";
      summary = "기획전 채널별 실적 요약 (4개년)";
    }
    if (!rows.length) return { error: "기획전 데이터가 없습니다." };
    const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
    return { rows, cols, filename:`GS_${nameTag}_${dateStr}.xlsx`, summary, parsed };
  }

  if (queryType === "nationality") {
    const { nationalities } = parsed;
    // 전체 인바운드 RN(월별) — 점유비 계산용
    const totalByMonth = {};
    for (const [nat, nd] of Object.entries(CI.by_nationality||{})) {
      for (const m of months) { const d = nd[m]; if (d) totalByMonth[m] = (totalByMonth[m]||0) + d.rn; }
    }
    for (const nat of nationalities) {
      const nd = (CI.by_nationality||{})[nat]; if (!nd) continue;
      for (const m of months) {
        const d = nd[m]; if (!d) continue;
        const share = totalByMonth[m] > 0 ? Math.round(d.rn / totalByMonth[m] * 1000) / 10 : 0;
        rows.push({국적:nat, 연도:m.slice(0,4), 월:+m.slice(4), RN:d.rn, "점유비(%)":share, "ADR(천원)":d.adr, "매출(백만원)":d.rev});
      }
    }
    if (!rows.length) return { error: "해당 국적 데이터가 없습니다." };
    cols = ["국적","연도","월","RN","점유비(%)","ADR(천원)","매출(백만원)"];
    nameTag = "국적_" + nationalities.join("_");
    summary = nationalities.join(", ") + " · " + monthLabel;
  }
  else if (queryType === "channel") {
    const { channels, properties, isTotal } = parsed;
    const bpc = CI.by_prop_channel || {};
    for (const ch of channels) {
      if (!isTotal && properties.length) {
        // 사업장 필터 적용: by_prop_channel 사용
        for (const prop of properties) {
          const pcd = (bpc[prop]||{})[ch]; if (!pcd) continue;
          for (const m of months) {
            const d = pcd[m]; if (!d) continue;
            const row = {사업장:prop, 채널:ch, 연도:m.slice(0,4), 월:+m.slice(4), RN:d.rn, "ADR(천원)":d.adr, "매출(백만원)":d.rev};
            // LY 비교
            const lym = String(+m.slice(0,4)-1)+m.slice(4);
            const ly = pcd[lym];
            if (ly) { row.LY_RN = ly.rn; row.LY_ADR = ly.adr; row.LY_매출 = ly.rev; row["YoY(%)"] = ly.rn>0? Math.round((d.rn-ly.rn)/ly.rn*1000)/10 : null; }
            rows.push(row);
          }
        }
      } else {
        // 전사 채널
        const cd = (CI.by_channel||{})[ch]; if (!cd) continue;
        for (const m of months) {
          const d = cd[m]; if (!d) continue;
          const row = {채널:ch, 연도:m.slice(0,4), 월:+m.slice(4), RN:d.rn, "ADR(천원)":d.adr, "매출(백만원)":d.rev};
          // LY 비교
          const lym = String(+m.slice(0,4)-1)+m.slice(4);
          const ly = cd[lym];
          if (ly) { row.LY_RN = ly.rn; row.LY_ADR = ly.adr; row.LY_매출 = ly.rev; row["YoY(%)"] = ly.rn>0? Math.round((d.rn-ly.rn)/ly.rn*1000)/10 : null; }
          rows.push(row);
        }
      }
    }
    if (!rows.length) return { error: "해당 채널 데이터가 없습니다." };
    const hasProp = !isTotal && properties.length;
    cols = hasProp ? ["사업장","채널","연도","월","RN","ADR(천원)","매출(백만원)"] : ["채널","연도","월","RN","ADR(천원)","매출(백만원)"];
    if (rows.some(r=>r.LY_RN)) cols.push("LY_RN","LY_ADR","LY_매출","YoY(%)");
    const propLabel = hasProp ? properties.join(", ") + " · " : "";
    nameTag = "채널_" + (hasProp ? properties.map(p=>p.replace(/\s/g,"")).join("_")+"_" : "") + channels.join("_");
    summary = propLabel + channels.join(", ") + " · " + monthLabel;
  }
  else {
    // property
    const { properties, segments, isTotal } = parsed;
    const segs = segments.includes("전체") ? ["OTA","G-OTA","Inbound"] : segments;
    const bf = CI.budget_fcst || {};

    const fetchRows = (source, label) => {
      for (const seg of segs) {
        const sd = source[seg] || {};
        for (const m of months) {
          const d = sd[m]; if (!d) continue;
          const row = {사업장:label, 세그먼트:seg, 연도:m.slice(0,4), 월:+m.slice(4), RN:d.rn, "ADR(천원)":d.adr, "매출(백만원)":d.rev};
          // LY
          const lym = String(+m.slice(0,4)-1)+m.slice(4);
          const ly = sd[lym];
          if (ly) { row.LY_RN = ly.rn; row["YoY(%)"] = ly.rn>0? Math.round((d.rn-ly.rn)/ly.rn*1000)/10 : null; }
          rows.push(row);
        }
      }
    };

    if (isTotal) {
      fetchRows(CI.totals, "전사 합계");
      // 목표/FCST: 전사 합산
      if (months.some(m=>m.startsWith("2026"))) {
        rows.forEach(r => {
          const mk = r.연도+String(r.월).padStart(2,"0");
          if (!mk.startsWith("2026")) return;
          let budSum=0, fcstSum=0;
          for (const [,pb] of Object.entries(bf)) {
            const bfm = pb[mk];
            if (bfm) { budSum += bfm.bud||0; fcstSum += bfm.fcst||0; }
          }
          if (budSum) r["목표_RN"] = budSum;
          if (fcstSum) r["FCST_RN"] = fcstSum;
        });
      }
    } else {
      for (const prop of properties) {
        const pd = CI.data[prop]; if (!pd) continue;
        fetchRows(pd, prop);
        // 목표/FCST
        const propBF = bf[prop] || {};
        rows.filter(r=>r.사업장===prop && r.연도==="2026").forEach(r => {
          const mk = r.연도+String(r.월).padStart(2,"0");
          const bfm = propBF[mk];
          if (bfm) {
            if (bfm.bud) r["목표_RN"] = bfm.bud;
            if (bfm.fcst) r["FCST_RN"] = bfm.fcst;
            if (bfm.fcst_src) r["FCST출처"] = bfm.fcst_src;
          }
        });
      }
    }

    if (!rows.length) return { error: "해당 조건에 맞는 데이터가 없습니다." };

    cols = ["사업장","세그먼트","연도","월","RN","ADR(천원)","매출(백만원)"];
    if (rows.some(r=>r["목표_RN"])) cols.push("목표_RN");
    if (rows.some(r=>r["FCST_RN"])) cols.push("FCST_RN");
    if (rows.some(r=>r["FCST출처"])) cols.push("FCST출처");
    if (rows.some(r=>r.LY_RN)) cols.push("LY_RN");
    if (rows.some(r=>r["YoY(%)"]!=null)) cols.push("YoY(%)");

    const pl = isTotal ? "전사" : properties.join(", ");
    nameTag = (isTotal?"전사":properties.map(p=>p.replace(/\s/g,"")).join("_")) + "_" + segments.join("_");
    summary = pl + " · " + segments.join(", ") + " · " + monthLabel;
  }

  const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
  return { rows, cols, filename:`GS_실적_${nameTag}_${dateStr}.xlsx`, summary, parsed };
}

// ═══════════════════════════════════════════════
// "채널별" → 주요 채널 분해
// ═══════════════════════════════════════════════

function showChannelBreakdown(parsed) {
  const { months } = parsed;
  const byCh = CI.by_channel || {};

  // LY 월키 계산
  const lyMonthMap = {};
  months.forEach(m => {
    const lym = String(+m.slice(0,4)-1)+m.slice(4);
    lyMonthMap[m] = lym;
  });

  // 해당 기간 채널별 RN 합산 → 상위 15개 (+ LY)
  const chTotals = [];
  for (const [ch, md] of Object.entries(byCh)) {
    let rn = 0, rev = 0, lyRn = 0, lyRev = 0;
    for (const m of months) {
      const d = md[m]; if (d) { rn += d.rn; rev += d.rev; }
      const lym = lyMonthMap[m];
      const ld = md[lym]; if (ld) { lyRn += ld.rn; lyRev += ld.rev; }
    }
    if (rn > 0) chTotals.push({ ch, rn, rev, adr: rn>0 ? Math.round(rev*1000000/rn/1000) : 0,
      lyRn, lyRev, lyAdr: lyRn>0 ? Math.round(lyRev*1000000/lyRn/1000) : 0 });
  }
  chTotals.sort((a,b) => b.rn - a.rn);
  const top = chTotals.slice(0, 15);
  const hasLY = top.some(t => t.lyRn > 0);

  const rows = top.map(t => {
    const row = {채널:t.ch, RN:t.rn, "ADR(천원)":t.adr, "매출(백만원)":Math.round(t.rev*100)/100};
    if (hasLY) {
      row.LY_RN = t.lyRn;
      row.LY_ADR = t.lyAdr;
      row.LY_매출 = Math.round(t.lyRev*100)/100;
      row["YoY(%)"] = t.lyRn > 0 ? Math.round((t.rn-t.lyRn)/t.lyRn*1000)/10 : null;
    }
    return row;
  });
  const cols = hasLY ? ["채널","RN","ADR(천원)","매출(백만원)","LY_RN","LY_ADR","LY_매출","YoY(%)"] : ["채널","RN","ADR(천원)","매출(백만원)"];
  const result = {
    rows, cols, summary: `채널별 실적 TOP15 · ${parsed.monthLabel}`,
    filename: `GS_채널별실적_${new Date().toISOString().slice(0,10).replace(/-/g,"")}.xlsx`, parsed
  };

  showResultMsg(result);
  lastContext = result;
}

// ═══════════════════════════════════════════════
// 비교 표시
// ═══════════════════════════════════════════════

function showCompareMsg(results, mode) {
  const COLORS = ["#d4a74a","#5cc4d0","#a07ee8","#5cc49a","#e87a8a"];
  const isYoY = mode === "yoy";

  // 라벨 추출
  const labels = results.map(r => r.summary.split("·")[0].trim());

  // YoY: 월 번호 기준 피벗 / 일반: 전체 월키 기준 피벗
  let pivotKeys = []; // 피벗 축 (월 번호 or 전체 월키)
  let byLabel = [];

  if (isYoY) {
    // 월 번호(1~12) 기준으로 피벗
    const monthNums = new Set();
    byLabel = results.map(r => {
      const byM = {};
      r.rows.forEach(row => {
        const mn = row.월;
        monthNums.add(mn);
        if (!byM[mn]) byM[mn] = {rn:0, rev:0};
        byM[mn].rn += row.RN||0;
        byM[mn].rev += row["매출(백만원)"]||0;
      });
      return byM;
    });
    pivotKeys = [...monthNums].sort((a,b) => a-b);
  } else {
    const allMonthSet = new Set();
    byLabel = results.map(r => {
      const byM = {};
      r.rows.forEach(row => {
        const mk = row.연도 + String(row.월).padStart(2,"0");
        allMonthSet.add(mk);
        if (!byM[mk]) byM[mk] = {rn:0, rev:0};
        byM[mk].rn += row.RN||0;
        byM[mk].rev += row["매출(백만원)"]||0;
      });
      return byM;
    });
    pivotKeys = [...allMonthSet].sort();
  }

  // 합계
  const totals = results.map((_,i) => {
    let rn=0, rev=0;
    pivotKeys.forEach(k => { const d=byLabel[i][k]; if(d){rn+=d.rn;rev+=d.rev;} });
    return {rn, rev:Math.round(rev*100)/100, adr:rn>0?Math.round(rev*1000000/rn/1000):0};
  });

  let html = `<b>${labels.map(l=>esc(l)).join(" vs ")}</b><br><br>`;

  // ── 합계 비교 테이블 ──
  html += '<div class="preview-wrap"><table class="pv-table"><thead><tr><th>지표</th>';
  labels.forEach(l => { html += `<th class="num">${esc(l)}</th>`; });
  if (labels.length === 2) html += '<th class="num">차이</th><th class="num">증감(%)</th>';
  html += '</tr></thead><tbody>';

  ["RN","ADR (천원)","매출 (백만원)"].forEach((name,mi) => {
    html += `<tr><td>${name}</td>`;
    const vals = totals.map(t => mi===0?t.rn:mi===1?t.adr:t.rev);
    vals.forEach(v => { html += `<td class="num">${fmt(v)}</td>`; });
    if (vals.length === 2) {
      const diff = vals[1]-vals[0];
      const pctVal = vals[0]>0 ? Math.round(diff/vals[0]*1000)/10 : null;
      const cls = diff>0?"num pos":diff<0?"num neg":"num";
      html += `<td class="${cls}">${diff>0?"+":""}${fmt(diff)}</td>`;
      html += `<td class="${cls}">${pctVal!=null?pct(pctVal):"-"}</td>`;
    }
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // ── 월별 비교 테이블 (열 구분) ──
  if (pivotKeys.length > 1) {
    html += '<div class="preview-wrap" style="margin-top:10px"><table class="pv-table"><thead><tr><th>월</th>';
    labels.forEach(l => { html += `<th class="num">${esc(l)} RN</th><th class="num">ADR</th><th class="num">매출</th>`; });
    if (isYoY && labels.length === 2) html += '<th class="num">YoY(%)</th>';
    html += '</tr></thead><tbody>';

    pivotKeys.forEach(k => {
      const mLabel = isYoY ? k+"월" : (k.slice(2,4)+"/"+parseInt(k.slice(4)));
      html += `<tr><td>${mLabel}</td>`;
      byLabel.forEach(bl => {
        const d = bl[k];
        if (d) {
          const adr = d.rn>0?Math.round(d.rev*1000000/d.rn/1000):0;
          html += `<td class="num">${fmt(d.rn)}</td><td class="num">${fmt(adr)}</td><td class="num">${fmt(Math.round(d.rev*100)/100)}</td>`;
        } else {
          html += '<td class="num">-</td><td class="num">-</td><td class="num">-</td>';
        }
      });
      // YoY %
      if (isYoY && labels.length === 2) {
        const d0 = byLabel[0][k], d1 = byLabel[1][k];
        if (d0 && d1 && d0.rn > 0) {
          const yoy = Math.round((d1.rn-d0.rn)/d0.rn*1000)/10;
          const cls = yoy>0?"num pos":yoy<0?"num neg":"num";
          html += `<td class="${cls}">${pct(yoy)}</td>`;
        } else { html += '<td class="num">-</td>'; }
      }
      html += '</tr>';
    });
    // 합계행
    html += '<tr class="row-total"><td>합계</td>';
    totals.forEach(t => {
      html += `<td class="num">${fmt(t.rn)}</td><td class="num">${fmt(t.adr)}</td><td class="num">${fmt(t.rev)}</td>`;
    });
    if (isYoY && totals.length === 2 && totals[0].rn > 0) {
      const yoyTotal = Math.round((totals[1].rn-totals[0].rn)/totals[0].rn*1000)/10;
      const cls = yoyTotal>0?"num pos":yoyTotal<0?"num neg":"num";
      html += `<td class="${cls}">${pct(yoyTotal)}</td>`;
    } else if (isYoY) { html += '<td class="num">-</td>'; }
    html += '</tr></tbody></table></div>';
  }

  // ── 차트: YoY→그룹 막대, 일반→라인 ──
  if (pivotKeys.length >= 2) {
    if (isYoY) {
      html += buildGroupedBarSVG(labels, byLabel, pivotKeys, COLORS);
    } else {
      html += buildCompareChartSVG(labels, byLabel, pivotKeys, COLORS);
    }
  }

  // ── 인사이트 ──
  if (labels.length === 2) {
    const rnDiff = isYoY ? totals[1].rn - totals[0].rn : totals[0].rn - totals[1].rn;
    const base = isYoY ? totals[0].rn : totals[1].rn;
    const rnPct = base > 0 ? Math.round(rnDiff / base * 1000) / 10 : 0;
    const more = isYoY ? labels[1] : labels[0];
    const less = isYoY ? labels[0] : labels[1];
    html += `<div class="insight-box">`;
    html += `<b>${esc(more)}</b>이 <b>${esc(less)}</b> 대비 RN 기준 `;
    html += rnDiff > 0 ? `<b style="color:var(--mint)">+${fmt(rnDiff)} (${pct(rnPct)})</b> 많습니다.`
      : `<b style="color:var(--rose)">${fmt(rnDiff)} (${pct(rnPct)})</b> 적습니다.`;
    html += `</div>`;
  }

  addBotMsg(html);
  lastContext = results[0];
}

// ── 그룹 막대 차트 (YoY용) ──
function buildGroupedBarSVG(labels, byLabel, months, colors) {
  const n = labels.length;
  const w = Math.max(months.length * (n*28+20) + 80, 350), h = 220;
  const padL = 50, padR = 20, padT = 30, padB = 35;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  let maxV = 0;
  byLabel.forEach(bl => { months.forEach(m => { const d=bl[m]; if(d && d.rn>maxV) maxV=d.rn; }); });
  if (!maxV) maxV = 1;

  const groupW = plotW / months.length;
  const barW = Math.min(Math.floor((groupW - 8) / n), 28);

  let svg = `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<text x="${padL}" y="16" fill="#8b8f9a" font-size="11" font-family="var(--sans)">월별 RN 비교</text>`;

  // 그리드
  for (let i=0;i<=4;i++) {
    const y = padT + plotH * i / 4;
    const val = Math.round(maxV * (4-i) / 4);
    svg += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${y+4}" fill="#5c6070" font-size="9" text-anchor="end" font-family="var(--mono)">${val>=1000?(val/1000).toFixed(1)+"k":val}</text>`;
  }

  // 막대
  months.forEach((m, mi) => {
    const gx = padL + mi * groupW + (groupW - n * barW) / 2;
    byLabel.forEach((bl, si) => {
      const d = bl[m];
      const val = d ? d.rn : 0;
      const barH = (val / maxV) * plotH;
      const x = gx + si * barW;
      const y = padT + plotH - barH;
      const col = colors[si % colors.length];
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW-2}" height="${barH.toFixed(1)}" rx="2" fill="${col}" opacity="0.85"/>`;
      if (barH > 18) {
        svg += `<text x="${(x+barW/2-1).toFixed(1)}" y="${(y+12).toFixed(1)}" fill="#fff" font-size="8" text-anchor="middle" font-family="var(--mono)">${val>=1000?(val/1000).toFixed(1)+"k":val}</text>`;
      }
    });
    // X축 라벨
    const lx = padL + mi * groupW + groupW / 2;
    const mLabel = typeof m === "number" ? m+"월" : (m.slice(2,4)+"/"+parseInt(m.slice(4)));
    svg += `<text x="${lx.toFixed(1)}" y="${h-8}" fill="#8b8f9a" font-size="10" text-anchor="middle" font-family="var(--sans)">${mLabel}</text>`;
  });

  // 범례
  labels.forEach((l,i) => {
    const lx = padL + i * 120;
    const col = colors[i % colors.length];
    svg += `<rect x="${lx}" y="${h-padB+20}" width="10" height="4" rx="1" fill="${col}"/>`;
    svg += `<text x="${lx+14}" y="${h-padB+24}" fill="#c8cad0" font-size="10" font-family="var(--sans)">${l.length>10?l.slice(0,10)+"…":l}</text>`;
  });

  svg += '</svg></div>';
  return svg;
}

function buildCompareChartSVG(labels, byLabel, months, colors) {
  const w = Math.max(months.length * 70, 350), h = 200;
  const padL = 50, padR = 20, padT = 30, padB = 35;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  // 최대값
  let maxV = 0;
  byLabel.forEach(bl => { months.forEach(m => { const d=bl[m]; if(d && d.rn>maxV) maxV=d.rn; }); });
  if (!maxV) maxV = 1;

  let svg = `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<text x="${padL}" y="16" fill="#8b8f9a" font-size="11" font-family="var(--sans)">월별 RN 추이 비교</text>`;

  // 그리드
  for (let i=0;i<=4;i++) {
    const y = padT + plotH * i / 4;
    const val = Math.round(maxV * (4-i) / 4);
    svg += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${y+4}" fill="#5c6070" font-size="9" text-anchor="end" font-family="var(--mono)">${val>=1000?(val/1000).toFixed(1)+"k":val}</text>`;
  }

  // 각 시리즈
  byLabel.forEach((bl, si) => {
    const pts = months.map((m,i) => {
      const d = bl[m];
      const x = padL + (i/(months.length-1||1)) * plotW;
      const y = d ? padT + plotH - (d.rn/maxV)*plotH : null;
      return {x, y, rn:d?d.rn:0};
    }).filter(p => p.y !== null);

    if (pts.length < 2) return;
    const path = pts.map((p,i) => (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
    const col = colors[si % colors.length];
    svg += `<path d="${path}" fill="none" stroke="${col}" stroke-width="2.5" opacity="0.85"/>`;
    pts.forEach(p => { svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${col}"/>`; });
  });

  // X축 라벨
  months.forEach((m,i) => {
    const x = padL + (i/(months.length-1||1)) * plotW;
    svg += `<text x="${x.toFixed(1)}" y="${h-8}" fill="#8b8f9a" font-size="9" text-anchor="middle" font-family="var(--sans)">${m.slice(2,4)}/${parseInt(m.slice(4))}</text>`;
  });

  // 범례
  labels.forEach((l,i) => {
    const lx = padL + i * 120;
    const col = colors[i % colors.length];
    svg += `<rect x="${lx}" y="${h-padB+18}" width="10" height="3" rx="1" fill="${col}"/>`;
    svg += `<text x="${lx+14}" y="${h-padB+22}" fill="#c8cad0" font-size="9" font-family="var(--sans)">${l.length>10?l.slice(0,10)+"…":l}</text>`;
  });

  svg += '</svg></div>';
  return svg;
}

// ═══════════════════════════════════════════════
// 결과 표시 (테이블 + 인사이트 + 차트 + 다운로드)
// ═══════════════════════════════════════════════

function showResultMsg(result) {
  const { rows, cols, filename, summary } = result;
  const numCols = new Set(["RN","ADR(천원)","매출(백만원)","연도","월","목표_RN","FCST_RN","LY_RN","LY_ADR","LY_매출","YoY(%)","점유비(%)"]);

  // 테이블
  let html = '<div class="preview-wrap"><table class="pv-table"><thead><tr>';
  cols.forEach(c => { html += `<th${numCols.has(c)?' class="num"':''}>${esc(c)}</th>`; });
  html += '</tr></thead><tbody>';

  rows.forEach(r => {
    html += '<tr>';
    cols.forEach(c => {
      const v = r[c];
      if (c==="YoY(%)") { const cls=v>0?"num pos":v<0?"num neg":"num"; html+=`<td class="${cls}">${v!=null?pct(v):"-"}</td>`; }
      else if (c==="점유비(%)") { html+=`<td class="num">${v!=null?v+"%":"-"}</td>`; }
      else if (numCols.has(c)) html+=`<td class="num">${fmt(v)}</td>`;
      else html+=`<td>${v?esc(String(v)):"-"}</td>`;
    });
    html += '</tr>';
  });

  // 합계
  if (rows.length > 1) {
    let tRN=0, tRev=0;
    rows.forEach(r => { tRN+=r.RN||0; tRev+=r["매출(백만원)"]||0; });
    const tADR = tRN>0 ? Math.round(tRev*1000000/tRN/1000) : 0;
    html += '<tr class="row-total">';
    cols.forEach((c,i) => {
      if (i===0) html+='<td>합계</td>';
      else if (c==="RN") html+=`<td class="num">${fmt(tRN)}</td>`;
      else if (c==="ADR(천원)") html+=`<td class="num">${fmt(tADR)}</td>`;
      else if (c==="매출(백만원)") html+=`<td class="num">${fmt(Math.round(tRev*100)/100)}</td>`;
      else html+='<td>-</td>';
    });
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  html += `<div class="pv-count">${esc(summary)} — ${rows.length}건</div>`;

  // ── 인사이트 ──
  html += buildInsight(result);

  // ── 미니 차트 (월별 RN 추이) ──
  if (rows.length >= 3) html += buildTrendChart(result);

  // ── 다운로드 ──
  const blob = buildExcel(result);
  const url = URL.createObjectURL(blob);
  html += `<a class="dl-btn" href="${url}" download="${esc(filename)}">` +
    `<svg class="dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">` +
    `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>` +
    `${esc(filename)}</a>`;

  addBotMsg(html);
}

// ── 자동 인사이트 ──
function buildInsight(result) {
  const { rows, parsed } = result;
  if (!rows.length) return "";
  let totalRN = 0, totalRev = 0, totalLY = 0, budSum = 0, fcstSum = 0;
  let hasYoY = false, hasBud = false, hasFcst = false;

  rows.forEach(r => {
    totalRN += r.RN || 0;
    totalRev += r["매출(백만원)"] || 0;
    if (r.LY_RN) { totalLY += r.LY_RN; hasYoY = true; }
    if (r["목표_RN"]) { budSum += r["목표_RN"]; hasBud = true; }
    if (r["FCST_RN"]) { fcstSum += r["FCST_RN"]; hasFcst = true; }
  });

  const parts = [];
  parts.push(`총 <b>${fmt(totalRN)}</b> RN · 매출 <b>${fmt(Math.round(totalRev*100)/100)}</b> 백만원`);
  if (totalRN > 0) parts.push(`평균 ADR <b>${fmt(Math.round(totalRev*1000000/totalRN/1000))}</b> 천원`);
  if (hasYoY && totalLY > 0) {
    const yoy = Math.round((totalRN - totalLY) / totalLY * 1000) / 10;
    const color = yoy >= 0 ? "var(--mint)" : "var(--rose)";
    parts.push(`전년 대비 <b style="color:${color}">${pct(yoy)}</b> (LY ${fmt(totalLY)} RN)`);
  }
  if (hasBud && budSum > 0) {
    const ach = Math.round(totalRN / budSum * 1000) / 10;
    parts.push(`목표 달성률 <b>${ach}%</b> (목표 ${fmt(budSum)} RN)`);
  }
  if (hasFcst && fcstSum > 0) {
    parts.push(`FCST <b>${fmt(fcstSum)}</b> RN`);
  }

  return `<div class="insight-box">${parts.join("<br>")}</div>`;
}

// ── 월별 RN 추이 차트 (SVG) — TY + LY 비교 ──
function buildTrendChart(result) {
  const { rows } = result;
  // 월별 TY 집계
  const byMonth = {};
  rows.forEach(r => {
    const k = r.연도 + String(r.월).padStart(2,"0");
    byMonth[k] = (byMonth[k] || 0) + (r.RN || 0);
  });
  const keys = Object.keys(byMonth).sort();
  if (keys.length < 2) return "";

  // LY 데이터 월별 집계 (같은 월 번호 기준)
  const hasLY = rows.some(r => r.LY_RN);
  const lyByMonthNum = {};
  if (hasLY) {
    rows.forEach(r => {
      if (r.LY_RN) {
        const mn = r.월;
        lyByMonthNum[mn] = (lyByMonthNum[mn] || 0) + r.LY_RN;
      }
    });
  }

  const vals = keys.map(k => byMonth[k]);
  const lyVals = hasLY ? keys.map(k => lyByMonthNum[+k.slice(4)] || 0) : [];
  const allVals = hasLY ? [...vals, ...lyVals.filter(v => v > 0)] : vals;
  const maxV = Math.max(...allVals) || 1;
  const w = Math.max(keys.length * 60, 300);
  const h = 180;
  const padL = 10, padR = 10, padT = 20, padB = 40;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  const pts = vals.map((v,i) => {
    const x = padL + (i / (vals.length-1||1)) * plotW;
    const y = padT + plotH - (v / maxV) * plotH;
    return [x, y];
  });

  let path = pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  let dots = pts.map((p,i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#d4a74a"/>`).join("");
  let labels = pts.map((p,i) => {
    const m = keys[i]; const label = m.slice(2,4)+"/"+parseInt(m.slice(4));
    return `<text x="${p[0].toFixed(1)}" y="${h-16}" fill="#8b8f9a" font-size="9" text-anchor="middle" font-family="var(--sans)">${label}</text>`;
  }).join("");

  // LY 라인
  let lyPath = "", lyDots = "", lyLegend = "";
  if (hasLY && lyVals.some(v => v > 0)) {
    const lyPts = lyVals.map((v,i) => {
      if (v <= 0) return null;
      const x = padL + (i / (vals.length-1||1)) * plotW;
      const y = padT + plotH - (v / maxV) * plotH;
      return [x, y];
    }).filter(Boolean);

    if (lyPts.length >= 2) {
      lyPath = `<path d="${lyPts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="#5c6070" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>`;
      lyDots = lyPts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="#5c6070" opacity="0.7"/>`).join("");
    }
    const ty = keys[0].slice(0,4);
    const ly = String(+ty - 1);
    lyLegend = `<rect x="${padL}" y="${h-8}" width="10" height="3" rx="1" fill="#d4a74a"/>` +
      `<text x="${padL+14}" y="${h-5}" fill="#c8cad0" font-size="9" font-family="var(--sans)">${ty} (TY)</text>` +
      `<rect x="${padL+80}" y="${h-8}" width="10" height="3" rx="1" fill="#5c6070"/>` +
      `<text x="${padL+94}" y="${h-5}" fill="#8b8f9a" font-size="9" font-family="var(--sans)">${ly} (LY)</text>`;
  }

  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto" xmlns="http://www.w3.org/2000/svg">
    ${lyPath}${lyDots}
    <path d="${path}" fill="none" stroke="#d4a74a" stroke-width="2" opacity="0.8"/>
    ${dots}${labels}${lyLegend}
  </svg></div>`;
}

// ── 엑셀 ──
function buildExcel(result) {
  const wb = XLSX.utils.book_new();
  const sd = result.rows.map(r => { const o={}; result.cols.forEach(c=>{o[c]=r[c]!=null?r[c]:null;}); return o; });
  const ws = XLSX.utils.json_to_sheet(sd);
  ws["!cols"] = result.cols.map(c => ({wch: Math.max(c.length+4, 12)}));
  XLSX.utils.book_append_sheet(wb, ws, "실적데이터");

  const p = result.parsed || {};
  const info = [
    {항목:"조회일시",내용:new Date().toLocaleString("ko-KR")},
    {항목:"조회유형",내용:p.queryType==="nationality"?"국적별":p.queryType==="channel"?"채널별":"사업장별"},
    {항목:"대상",내용:p.queryType==="nationality"?(p.nationalities||[]).join(", "):p.queryType==="channel"?(p.channels||[]).join(", "):(p.isTotal?"전사":(p.properties||[]).join(", "))},
    {항목:"기간",내용:p.monthLabel||""},
    {항목:"건수",내용:result.rows.length+"건"},
    {항목:"단위",내용:"RN=실, ADR=천원, 매출=백만원"},
  ];
  const ws2 = XLSX.utils.json_to_sheet(info);
  ws2["!cols"] = [{wch:12},{wch:60}];
  XLSX.utils.book_append_sheet(wb, ws2, "조회조건");

  const buf = XLSX.write(wb, {bookType:"xlsx",type:"array"});
  return new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
</script>
</body>
