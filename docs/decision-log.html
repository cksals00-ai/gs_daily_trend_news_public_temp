<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결정 로그 · GS 대시보드</title>
<style>
:root{
  --bg:#0f1117; --glass:rgba(255,255,255,.04); --ink:#f0f0f4;
  --gold:#d4a74a; --gold-glow:rgba(212,167,74,.15);
  --violet:#a07ee8; --cyan:#5cc4d0; --mint:#5cc49a; --orange:#e89a5c;
  --rule:rgba(255,255,255,.08);
  --sans:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,sans-serif;
  --mono:'JetBrains Mono','D2Coding',Consolas,monospace;
  --sub:rgba(240,240,244,.55);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;padding:0 0 60px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{padding:40px 0 24px;border-bottom:1px solid var(--rule);margin-bottom:28px}
h1{margin:0 0 8px;font-size:26px;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--gold)}
.lede{margin:0;color:var(--sub);font-size:14px;line-height:1.7;max-width:70ch}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 30px}
.stat{background:var(--glass);border:1px solid var(--rule);border-radius:12px;
      padding:14px 18px;min-width:120px}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--gold);line-height:1}
.stat .l{font-size:11px;color:var(--sub);margin-top:6px;letter-spacing:.04em}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{background:transparent;border:1px solid var(--rule);color:var(--sub);
      border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer;
      font-family:var(--sans);transition:.15s}
.chip:hover{border-color:var(--gold);color:var(--ink)}
.chip.on{background:var(--gold-glow);border-color:var(--gold);color:var(--gold)}
.card{background:var(--glass);border:1px solid var(--rule);border-radius:14px;
      padding:22px 24px;margin-bottom:14px}
.card.pending{border-left:3px solid var(--orange)}
.card.done{border-left:3px solid var(--mint)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
     flex-wrap:wrap;margin-bottom:16px}
.date{font-family:var(--mono);font-size:13px;color:var(--gold);font-weight:600}
.src{font-size:11px;color:var(--sub);letter-spacing:.03em}
.badge{font-size:10px;padding:3px 9px;border-radius:999px;letter-spacing:.05em;font-weight:700}
.badge.pending{background:rgba(232,154,92,.15);color:var(--orange)}
.badge.done{background:rgba(92,196,154,.15);color:var(--mint)}
.row{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:9px 0;
     border-top:1px solid var(--rule);align-items:start}
.row:first-of-type{border-top:none}
.k{font-size:11px;color:var(--sub);letter-spacing:.06em;padding-top:2px;font-weight:600}
.v{font-size:14px;line-height:1.65}
.v.decision{color:var(--ink);font-weight:600}
.v.expected{color:var(--cyan)}
.v.result{color:var(--mint)}
.v.empty{color:rgba(240,240,244,.28);font-style:italic}
.tags{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;background:rgba(160,126,232,.13);color:var(--violet);
     padding:3px 9px;border-radius:6px;letter-spacing:.03em}
.empty-state{text-align:center;padding:60px 20px;color:var(--sub)}
footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--rule);
       font-size:12px;color:var(--sub);line-height:1.8}
code{font-family:var(--mono);background:rgba(255,255,255,.06);padding:2px 6px;
     border-radius:4px;font-size:12px;color:var(--gold)}
@media(max-width:640px){.row{grid-template-columns:1fr;gap:4px}.wrap{padding:0 14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>결정 <span>로그</span></h1>
    <p class="lede">
      대시보드를 보고 무엇을 결정했는지, 무엇을 기대했는지, 실제로 어떻게 됐는지를 기록합니다.
      기대효과를 <strong>먼저</strong> 적고 결과를 <strong>나중에</strong> 채우는 것이 이 로그의 핵심입니다.
      그래야 "대시보드가 무엇을 바꿨는가"에 답할 수 있습니다.
    </p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
  <footer>
    데이터 소스 <code>docs/data/decision_log.json</code> ·
    추가는 <code>./decide.sh</code> 로 하거나 JSON을 직접 편집합니다.
  </footer>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ALL = [], activeTag = null;
function row(label, val, cls){
  const empty = !val || !String(val).trim();
  return `<div class="row"><div class="k">${label}</div>
    <div class="v ${cls||''} ${empty?'empty':''}">${empty?'— 아직 비어있음':esc(val)}</div></div>`;
}
function render(){
  const items = ALL.filter(e => e.id !== 'SAMPLE')
                   .filter(e => !activeTag || (e.tags||[]).includes(activeTag))
                   .sort((a,b) => String(b.date).localeCompare(String(a.date)));
  const done = items.filter(e => e.result && e.result.trim()).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${items.length}</div><div class="l">기록된 결정</div></div>
    <div class="stat"><div class="n">${done}</div><div class="l">결과 확인됨</div></div>
    <div class="stat"><div class="n">${items.length-done}</div><div class="l">결과 대기</div></div>`;
  const tags = [...new Set(ALL.flatMap(e => e.tags||[]))].filter(t => !t.includes('샘플'));
  document.getElementById('filters').innerHTML =
    `<button class="chip ${activeTag?'':'on'}" data-t="">전체</button>` +
    tags.map(t => `<button class="chip ${activeTag===t?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  document.getElementById('list').innerHTML = items.length ? items.map(e => {
    const isDone = e.result && e.result.trim();
    return `<div class="card ${isDone?'done':'pending'}">
      <div class="top">
        <div><span class="date">${esc(e.date)}</span>
             <span class="src"> · ${esc(e.source)}</span></div>
        <span class="badge ${isDone?'done':'pending'}">${isDone?'결과 확인':'결과 대기'}</span>
      </div>
      ${row('관찰', e.observation)}
      ${row('결정', e.decision, 'decision')}
      ${row('담당', e.owner)}
      ${row('기대효과', e.expected, 'expected')}
      ${row('실제결과', e.result, 'result')}
      ${e.result_date ? row('확인일', e.result_date) : ''}
      ${(e.tags||[]).length ? `<div class="tags">${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('') : `<div class="empty-state">아직 기록이 없습니다.</div>`;
  document.querySelectorAll('.chip').forEach(c =>
    c.onclick = () => { activeTag = c.dataset.t || null; render(); });
}
fetch('./data/decision_log.json?v=' + Date.now())
  .then(r => r.json())
  .then(d => { ALL = d.entries || []; render(); })
  .catch(() => {
    document.getElementById('list').innerHTML =
      `<div class="empty-state">decision_log.json 을 불러오지 못했습니다.</div>`;
  });
</script>
<script src="./js/menu-visibility.js"></script>
<script src="./js/visit-log.js"></script>
</body>
</html>
