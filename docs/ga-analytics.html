<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>웹 애널리틱스 (GA4) · SONO GS 리포트</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#1a1d23; --bg-card:#252932; --bg-deep:#14171c; --bg-soft:#2d3138; --bg-hover:#353a44;
    --ink:#f5f5f7; --ink-soft:#e0e0e3; --ink-muted:#a8acb3; --ink-faint:#7a7e85;
    --gold:#c9a063; --gold-bright:#e6b970;
    --positive:#4caf6f; --warning:#e8a256; --negative:#e57373; --info:#5a9fc4;
    --rule:rgba(255,255,255,0.12); --rule-strong:rgba(255,255,255,0.22);
    --sans:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --mono:'JetBrains Mono','Pretendard Variable',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* ===== 상단 네비 (index.html 공통 gsn 스타일 축약) ===== */
  .gsn{background:var(--bg-deep);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:200}
  .gsn-wrap{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;height:48px;overflow-x:auto}
  .gsn-brand{font-weight:700;color:var(--gold-bright);margin-right:18px;padding-right:16px;border-right:1px solid var(--rule);white-space:nowrap;font-size:13px}
  .gsn-brand-dot{color:var(--gold)}
  .gsn-links{display:flex;gap:2px;flex:1}
  .gsn-item{padding:6px 11px;border-radius:7px;color:var(--ink-muted);font-size:12.5px;white-space:nowrap}
  .gsn-item:hover{background:var(--bg-hover);color:var(--ink)}
  .gsn-item.active{background:var(--bg-soft);color:var(--gold-bright);font-weight:600}
  .gsn-toggle{display:none}

  .wrap{max-width:1280px;margin:0 auto;padding:28px 20px 80px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:6px}
  .eyebrow{color:var(--gold);font-size:12px;letter-spacing:.16em;font-weight:600;text-transform:uppercase}
  h1{font-size:26px;font-weight:800;margin-top:4px}
  .sub{color:var(--ink-muted);font-size:13px;margin-top:4px}
  .meta-line{color:var(--ink-faint);font-size:12px;font-family:var(--mono);text-align:right}
  .divider{height:1px;background:var(--rule);margin:20px 0 24px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .kpi{background:var(--bg-card);border:1px solid var(--rule);border-radius:14px;padding:18px 18px 16px}
  .kpi .label{color:var(--ink-muted);font-size:12.5px;font-weight:600;margin-bottom:10px}
  .kpi .val{font-size:30px;font-weight:800;letter-spacing:-.02em;font-family:var(--mono)}
  .kpi .val small{font-size:15px;color:var(--ink-muted);font-weight:600;margin-left:2px}
  .kpi .delta{font-size:12px;margin-top:8px;font-weight:600}
  .delta.up{color:var(--positive)} .delta.down{color:var(--negative)} .delta.flat{color:var(--ink-faint)}

  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:22px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--bg-card);border:1px solid var(--rule);border-radius:14px;padding:18px 20px}
  .card h3{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--ink)}
  .card h3 .tag{color:var(--ink-faint);font-weight:500;font-size:12px;margin-left:6px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule)}
  th{color:var(--ink-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  tr:last-child td{border-bottom:none}
  .bar-cell{position:relative}
  .bar{position:absolute;left:0;top:50%;transform:translateY(-50%);height:22px;background:linear-gradient(90deg,rgba(201,160,99,.28),rgba(201,160,99,.08));border-radius:5px;z-index:0}
  .bar-cell span{position:relative;z-index:1}

  .empty{background:var(--bg-card);border:1px dashed var(--rule-strong);border-radius:16px;padding:44px 28px;text-align:center;margin-top:26px}
  .empty .ico{font-size:34px;margin-bottom:12px}
  .empty h2{font-size:18px;margin-bottom:8px}
  .empty p{color:var(--ink-muted);font-size:13.5px;max-width:620px;margin:0 auto 6px}
  .empty code{background:var(--bg-deep);padding:2px 7px;border-radius:5px;font-family:var(--mono);font-size:12px;color:var(--gold-bright)}
  /* 자동 인사이트 */
  .ins-head{display:flex;align-items:center;gap:8px;margin:2px 0 14px}
  .ins-head .t{font-size:15px;font-weight:800}
  .ins-head .b{font-size:11px;color:var(--gold);border:1px solid rgba(201,160,99,.4);border-radius:999px;padding:2px 9px;letter-spacing:.05em}
  .insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:10px;margin-bottom:24px}
  .ins{background:var(--bg-card);border:1px solid var(--rule);border-left-width:3px;border-radius:10px;padding:11px 13px}
  .ins .it{font-size:13px;font-weight:700;margin-bottom:4px;display:flex;gap:6px;align-items:flex-start;line-height:1.35}
  .ins .ib{font-size:12px;color:var(--ink-muted);line-height:1.5}
  .ins-counts{display:flex;gap:6px;flex-wrap:wrap}
  .ins-counts b{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--rule)}
  .c-warn{color:var(--negative)} .c-action{color:var(--gold-bright)} .c-good{color:var(--positive)} .c-info{color:var(--info)}
  .more-btn{width:100%;margin:2px 0 24px;padding:9px;background:var(--bg-card);border:1px solid var(--rule);border-radius:10px;color:var(--ink-muted);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .more-btn:hover{background:var(--bg-hover);color:var(--ink)}
  /* 리텐션 구성 막대 */
  .ret-comp{margin:10px 0}
  .ret-comp .rl{font-size:12px;color:var(--ink-muted);margin-bottom:5px;display:flex;justify-content:space-between}
  .ret-bar{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--rule)}
  .ret-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .ret-new{background:#7a7e85} .ret-ret{background:#3987e5}
  .ins.warn{border-left-color:var(--negative)} .ins.warn .it{color:var(--negative)}
  .ins.action{border-left-color:var(--gold-bright)} .ins.action .it{color:var(--gold-bright)}
  .ins.good{border-left-color:var(--positive)} .ins.good .it{color:var(--positive)}
  .ins.info{border-left-color:var(--info)} .ins.info .it{color:var(--info)}
  /* 액션 플랜 */
  .act-head{display:flex;align-items:center;gap:8px;margin:2px 0 14px}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
  @media(max-width:820px){.acts{grid-template-columns:1fr}}
  .act{background:var(--bg-card);border:1px solid var(--rule);border-left-width:4px;border-radius:12px;padding:14px 16px}
  .act.warn{border-left-color:var(--negative)} .act.action{border-left-color:var(--gold-bright)} .act.info{border-left-color:var(--info)}
  .act-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .act-pri{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a1d23;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .act-lever{font-size:11px;font-weight:700;color:var(--ink-muted);background:var(--bg-soft);border:1px solid var(--rule);border-radius:999px;padding:2px 9px}
  .act-impact{margin-left:auto;font-size:12px;font-weight:800;color:var(--gold-bright);font-family:var(--mono);text-align:right}
  .act-title{font-size:14.5px;font-weight:800;margin-bottom:4px}
  .act-why{font-size:12px;color:var(--ink-muted);margin-bottom:7px}
  .act-how{font-size:12px;color:var(--ink-soft);background:var(--bg-deep);border-radius:7px;padding:7px 10px;line-height:1.45}
  /* 고객여정 퍼널 */
  .fn-callout{background:linear-gradient(90deg,rgba(57,135,229,.16),rgba(25,158,112,.06));border:1px solid var(--rule);border-radius:14px;padding:16px 20px;margin-bottom:14px}
  .fc-big{font-size:27px;font-weight:800;font-family:var(--mono);color:var(--gold-bright);letter-spacing:-.01em}
  .fc-big span{font-size:14px;color:var(--ink-muted);font-weight:600}
  .fc-sub{font-size:12.5px;color:var(--ink-muted);margin-top:5px}
  .fc-sub b{color:var(--ink)}
  .fn-step{display:grid;grid-template-columns:92px 1fr 92px;gap:10px;align-items:center;margin:9px 0}
  .fn-label{font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .fn-track{background:var(--bg-deep);border-radius:8px;height:32px;overflow:hidden}
  .fn-fill{height:100%;background:linear-gradient(90deg,#3987e5,#199e70);border-radius:8px;display:flex;align-items:center;padding-left:12px;color:#fff;font-family:var(--mono);font-weight:700;font-size:12.5px;white-space:nowrap}
  .fn-drop{font-size:11px;color:var(--ink-faint);text-align:right}
  .cvr-row{display:grid;grid-template-columns:100px 1fr 44px;gap:10px;align-items:center;margin:7px 0}
  .cvr-name{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cvr-track{background:var(--bg-deep);border-radius:6px;height:18px;overflow:hidden}
  .cvr-fill{height:100%;background:#3987e5;border-radius:6px}
  .cvr-fill.low{background:var(--negative)}
  .cvr-val{font-size:12px;font-family:var(--mono);text-align:right;color:var(--ink-soft)}
  .heat-row{display:grid;grid-template-columns:22px repeat(24,1fr);gap:2px;align-items:center;margin-bottom:2px}
  .heat-row .d{font-size:10px;color:var(--ink-faint);text-align:center}
  .heat-cell{height:15px;border-radius:2px;background:var(--bg-deep)}
  .heat-ax{display:grid;grid-template-columns:22px repeat(24,1fr);gap:2px;margin-top:4px}
  .heat-ax span{font-size:9px;color:var(--ink-faint);text-align:center}
  /* 월 요약 스트립 */
  .mstrip{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .mstrip span{background:var(--bg-soft);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-soft);font-weight:600}
  .mstrip span b{color:var(--gold-bright)}
  .mstrip span.up b{color:var(--positive)} .mstrip span.down b{color:var(--negative)}
  /* 페이지 인사이트 콜아웃 */
  .pins{display:flex;flex-direction:column;gap:8px;margin:2px 0 16px}
  .pin{background:var(--bg-soft);border:1px solid var(--rule);border-left:3px solid var(--gold);border-radius:8px;padding:10px 13px;font-size:13px;line-height:1.6;color:var(--ink-soft)}
  .pin b{color:var(--gold-bright);font-weight:700}
  /* 키워드 레이더 */
  .kw-hi{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .kw-card{background:var(--bg-soft);border:1px solid var(--rule);border-left:3px solid var(--gold);border-radius:10px;padding:12px 14px}
  .kw-top{display:flex;gap:8px;align-items:flex-start}
  .kw-ic{font-size:15px;line-height:1.4}
  .kw-title{color:var(--ink);font-weight:700;font-size:13.5px;line-height:1.45;text-decoration:none}
  .kw-title:hover{color:var(--gold-bright);text-decoration:underline}
  .kw-meta{color:var(--ink-faint);font-size:11px;margin:5px 0 0 23px}
  .kw-ga{color:var(--ink-soft);font-size:12px;line-height:1.55;margin:8px 0 0 23px;padding-top:8px;border-top:1px solid var(--rule)}
  .kw-det{border-bottom:1px solid rgba(255,255,255,.04)}
  .kw-det summary{list-style:none;cursor:pointer}
  .kw-det summary::-webkit-details-marker{display:none}
  .kw-det[open] summary .cvr-name{color:var(--gold-bright)}
  .kw-links{display:flex;flex-direction:column;gap:5px;padding:2px 0 9px 4px}
  .kw-links a{color:var(--ink-soft);font-size:11.5px;line-height:1.5;text-decoration:none}
  .kw-links a:hover{color:var(--gold-bright);text-decoration:underline}
  .kw-up{color:var(--gold-bright);font-weight:700;font-size:11px}
  .kw-dn{color:var(--ink-faint);font-weight:700;font-size:11px}
  .kw-new{color:var(--gold);font-weight:700;font-size:11px}
  /* 월 선택기 */
  .msel{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;margin-bottom:6px}
  .mbtn{flex:0 0 auto;padding:6px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--bg-card);color:var(--ink-muted);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
  .mbtn:hover{background:var(--bg-hover);color:var(--ink)}
  .mbtn.active{background:var(--gold);color:#1a1d23;border-color:var(--gold)}
  .scope-tag{font-size:11px;color:var(--gold);font-weight:600;margin-left:8px}
  .chartbox{position:relative;height:280px}
  .foot{color:var(--ink-faint);font-size:11.5px;margin-top:30px;text-align:center;font-family:var(--mono)}
  .pill{display:inline-block;background:var(--bg-soft);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--ink-muted);margin-left:8px}
</style>
</head>

<script>
const NF = new Intl.NumberFormat('ko-KR');
const fmt = n => (n==null||isNaN(n)) ? '—' : NF.format(Math.round(n));
const fmtPct = n => (n==null||isNaN(n)) ? '—' : (Math.round(n*10)/10).toFixed(1)+'%';
function dur(sec){ if(sec==null||isNaN(sec)) return '—'; sec=Math.round(sec); const m=Math.floor(sec/60), s=sec%60; return m+'분 '+String(s).padStart(2,'0')+'초'; }
function deltaHtml(pct, label){
  label = label || '전년 동기';
  if(pct==null||isNaN(pct)) return `<span class="delta flat">— ${label} 대비</span>`;
  const up = pct>=0; const cls = Math.abs(pct)<0.05?'flat':(up?'up':'down');
  const arw = cls==='flat'?'•':(up?'▲':'▼');
  return `<span class="delta ${cls}">${arw} ${Math.abs(pct).toFixed(1)}% <span style="color:var(--ink-faint);font-weight:500">${label}</span></span>`;
}

const MONTH_LABEL = ym => ym && ym.length===6 ? `${ym.slice(2,4)}.${ym.slice(4,6)}` : ym;

// 채널 한글 풀이(English) 매핑
const CH_KO={
  'Direct':'직접유입','Organic Search':'자연검색','Referral':'추천유입','Unassigned':'미분류',
  'Paid Social':'유료소셜','Organic Social':'자연소셜','Cross-network':'크로스네트워크','Email':'이메일',
  'Paid Other':'기타유료','Affiliates':'제휴','Paid Search':'유료검색','Display':'디스플레이',
  'AI Assistant':'AI어시스턴트','Mobile Push Notifications':'모바일푸시','Organic Video':'자연동영상',
  'Paid Video':'유료동영상','SMS':'문자','Audio':'오디오','기타':'기타'};
const chLabel = n => { if(n==null||n==='') return '(기타)'; const ko=CH_KO[n]; return ko?`${ko}(${n})`:n; };

// 페이지 경로 → 한글 라벨 (주요 경로 우선, 없으면 세그먼트 조합)
const PAGE_KO={
  '/':'홈','/member/login':'로그인','/member/joinType':'회원가입 유형선택',

function renderPages(pages){
  if(!pages||!pages.length) return '<p style="color:var(--ink-faint)">데이터 없음</p>';
  const rows=pages.slice(0,15).map(r=>({p:r.pagePath,pv:+r.screenPageViews||0,u:+r.activeUsers||0,
    d:(r.activeUsers?((+r.screenPageViews)/(+r.activeUsers)):0)}));
  const max=Math.max(...rows.map(r=>r.pv))||1;
  const find=pp=>pages.find(x=>x.pagePath===pp);
  // 동적 인사이트
  const tips=[];
  const login=find('/member/login'), home=find('/');
  if(login){ const lu=+login.activeUsers; const cmp=home?` — 홈(${fmt(+home.activeUsers)})보다 ${lu>+home.activeUsers?'많은':'적은'}`:'';
    if(!home||lu>=+home.activeUsers*0.7) tips.push(`🔑 <b>로그인이 최대 관문</b> · 유니크 ${fmt(lu)}명${cmp} 모든 예약이 이 페이지를 거칩니다. 소셜·간편 로그인/비회원 예약으로 이탈만 줄여도 예약 퍼널 전체가 올라갑니다.`); }
  // 탐색깊이 최고 (사용자 20만+ 만)
  const deep=rows.filter(r=>r.u>=200000).sort((a,b)=>b.d-a.d)[0];
  if(deep&&deep.d>=7) tips.push(`🔁 <b>${pageKo(deep.p)}에서 결정 지연</b> · 인당 ${deep.d.toFixed(1)}회 반복 조회. 객실을 수십 번 오가며 비교 = 가격·잔여·조건을 못 찾고 헤매는 신호일 수 있습니다. 리스트에 최저가·잔여·조건 노출을 강화하세요.`);
  // 모바일 객실조회 → 결제 도달
  const rm=find('/reserve/room/mo'), pay=find('/reserve/room/mo/payment');
  if(rm&&pay){ const ru=+rm.activeUsers, pu=+pay.activeUsers; const rate=ru?(pu/ru*100):0;
    tips.push(`📉 <b>모바일 결제 이탈</b> · 객실조회 ${fmt(ru)}명 → 결제 ${fmt(pu)}명(<b>${rate.toFixed(0)}%</b> 도달). ${(100-rate).toFixed(0)}%가 결제 전 이탈 — 모바일 결제단계 간소화가 가장 큰 레버입니다.`); }
  // 마이소노 리텐션
  const dash=find('/mysono/dashboard');
  if(dash){ const du=(+dash.screenPageViews)/(+dash.activeUsers||1);
    if(du>=4) tips.push(`♻️ <b>마이소노가 리텐션 엔진</b> · ${fmt(+dash.activeUsers)}명이 인당 ${du.toFixed(1)}회 재방문. 로열 회원 재방문 허브 — 대시보드에 개인화 추천·쿠폰을 노출해 재예약을 유도하세요.`); }

  const body=rows.map(r=>{
    const pct=(r.pv/max*100).toFixed(1);
    const hot=r.d>=7; const dCol=hot?'#e0a44a':'var(--ink)';
    return `<tr>
      <td class="bar-cell"><span><span style="color:var(--ink)">${pageKo(r.p)}</span> <span style="color:var(--ink-faint);font-size:10px;font-family:var(--mono)">${r.p}</span></span><div class="bar" style="width:${pct}%"></div></td>
      <td class="num">${fmt(r.pv)}</td><td class="num">${fmt(r.u)}</td>
      <td class="num" style="color:${dCol};font-weight:${hot?'800':'600'}" title="페이지뷰 ÷ 사용자 = 탐색 깊이">${r.d.toFixed(1)}</td></tr>`;
  }).join('');
  const table=`<table><thead><tr><th>페이지</th><th class="num">페이지뷰</th><th class="num">사용자</th><th class="num" title="페이지뷰÷사용자">깊이</th></tr></thead><tbody>${body}</tbody></table>`;
  const callout=tips.length?`<div class="pins">${tips.map(t=>`<div class="pin">${t}</div>`).join('')}</div>`:'';
  return callout+table;
}

function tableBars(rows, dimKey, dimLabel, valKey, valLabel, extra, nameFn){
  if(!rows||!rows.length) return '';
  const max = Math.max(...rows.map(r=>Number(r[valKey])||0)) || 1;
  const body = rows.map(r=>{
    const v = Number(r[valKey])||0; const pct=(v/max*100).toFixed(1);
    const ex = extra ? `<td class="num">${extra.fmt(r[extra.key])}</td>` : '';
    let name = nameFn ? nameFn(r[dimKey]) : (r[dimKey]==null||r[dimKey]===''? '(기타)' : r[dimKey]);
    if(dimKey==='pagePath' && r.pageTitle) name = `<span style="color:var(--ink)">${r.pageTitle}</span><br><span style="color:var(--ink-faint);font-size:11px;font-family:var(--mono)">${r.pagePath}</span>`;
    return `<tr>
      <td class="bar-cell"><span>${name}</span><div class="bar" style="width:${pct}%"></div></td>
      <td class="num">${fmt(v)}</td>${ex}</tr>`;
  }).join('');
  const exHead = extra?`<th class="num">${extra.label}</th>`:'';
  return `<table><thead><tr><th>${dimLabel}</th><th class="num">${valLabel}</th>${exHead}</tr></thead><tbody>${body}</tbody></table>`;
}

  html+=statTile('신규 세션전환', n.cvr_session!=null?n.cvr_session+'%':'—','구매 ÷ 세션');

  html+=statTile('재방문 매출비중', NF.format(Math.round(r.revenue/((n.revenue+r.revenue)||1)*100))+'%','전체 대비');

function statTile(label,val,note){

}
function renderFunnel(data){
  const fn=(data.sections||{}).funnel, box=document.getElementById('funnelBox'); if(!box||!fn) return;
  const steps=fn.steps||[], max=Math.max(...steps.map(s=>s.count||0))||1;
  const dv=fn.device||{}, up=fn.mobile_uplift, c=fn.conversions||{};
  const mr=dv.mobile&&dv.mobile.rate, dr=dv.desktop&&dv.desktop.rate;
  let html=`<div class="ins-head" style="margin-top:24px"><span class="t">🧭 고객여정 · 구매 퍼널</span><span class="b">최근 12개월</span></div>`;
  if(up&&mr&&dr){
    html+=`<div class="fn-callout"><div class="fc-big">연 +${NF.format(up)} <span>구매 기회</span></div>
      <div class="fc-sub">모바일 전환 <b>${mr}%</b> vs 데스크톱 <b>${dr}%</b> — 모바일이 데스크톱 수준이면 확보되는 규모. 모바일 결제 UX가 최우선 과제.</div></div>`;
  }
  html+='<div class="card"><h3>여정 단계 <span class="tag">단계별 볼륨 · 이전 단계 대비</span></h3>';
  steps.forEach((s,i)=>{
    const pct=(s.count/max*100).toFixed(1), prev=i>0?steps[i-1].count:null;
    const drop=prev?`이전比 ${(s.count/prev*100).toFixed(0)}%`:'기준';
    html+=`<div class="fn-step"><div class="fn-label">${s.label}</div>
      <div class="fn-track"><div class="fn-fill" style="width:${Math.max(pct,7)}%">${NF.format(s.count)}</div></div>
      <div class="fn-drop">${drop}${s.mobile_pct!=null?`<br>📱${s.mobile_pct}%`:''}</div></div>`;
  });
  html+='</div>';
  html+='<div class="kpis" style="margin-top:14px">';
  html+=statTile('예약버튼→구매', c.booking_to_purchase!=null?c.booking_to_purchase+'%':'—','클릭 후 마감률');
  html+=statTile('폼 완료율', c.form_completion!=null?c.form_completion+'%':'—','시작→완료');
  html+=statTile('모바일 전환', mr!=null?mr+'%':'—','구매 ÷ 사용자');
  html+=statTile('데스크톱 전환', dr!=null?dr+'%':'—','구매 ÷ 사용자');
  html+='</div>';
  // 채널별 전환율 + 요일별 예약
  const cc=fn.channel_conv||[], wd=fn.weekday||[];
  html+='<div class="grid" style="grid-template-columns:1.15fr 1fr;margin-top:14px">';
  if(cc.length){
    const cmax=Math.max(...cc.map(c=>c.cvr))||1;
    html+='<div class="card"><h3>채널별 전환율 <span class="tag">구매 ÷ 세션</span></h3>';
    html+=cc.slice(0,10).map(c=>`<div class="cvr-row"><span class="cvr-name">${chLabel(c.channel)}</span>
      <div class="cvr-track"><div class="cvr-fill${c.cvr<1.5?' low':''}" style="width:${Math.max((c.cvr/cmax*100),4).toFixed(0)}%"></div></div>
      <span class="cvr-val">${c.cvr}%</span></div>`).join('');
    html+='</div>';
  }
  if(wd.length===7) html+=`<div class="card"><h3>요일별 예약 <span class="tag">구매 기준</span></h3><div class="chartbox" style="height:230px"><canvas id="wdChart"></canvas></div></div>`;
  html+='</div>';
  // 요일×시간대 히트맵
  const hm=fn.heatmap;
  if(hm&&hm.length===7){
    const hmax=Math.max(...hm.flat())||1, dn=['일','월','화','수','목','금','토'];
    let h='<div class="card" style="margin-top:14px"><h3>요일 × 시간대 예약 히트맵 <span class="tag">구매 밀도 · 진할수록 많음</span></h3>';
    for(let d=0;d<7;d++){
      h+=`<div class="heat-row"><span class="d">${dn[d]}</span>`;
      for(let hr=0;hr<24;hr++){ const v=hm[d][hr]||0, a=(0.05+0.95*(v/hmax)).toFixed(3);
        h+=`<div class="heat-cell" style="background:rgba(57,135,229,${a})" title="${dn[d]} ${hr}시 · ${NF.format(v)}"></div>`; }
      h+='</div>';
    }
    h+='<div class="heat-ax"><span></span>'; for(let hr=0;hr<24;hr++) h+=`<span>${hr%6===0?hr+'시':''}</span>`; h+='</div></div>';
    html+=h;
  }
  box.innerHTML=html;
  if(wd.length===7 && typeof Chart!=='undefined'){
    const names=['일','월','화','수','목','금','토'];
    try{ new Chart(document.getElementById('wdChart'),{type:'bar',
      data:{labels:names,datasets:[{data:wd.map(w=>w.purchases),
        backgroundColor:wd.map(w=>(w.dow===0||w.dow===6)?'#7a7e85':CAT[0]),borderRadius:5}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false}},y:{grid:{color:GC.grid},ticks:{callback:v=>NF.format(v)}}}}});
    }catch(e){console.warn(e);}
  }
}

function renderScope(){
  const data=_GA, s=data.sections||{}, ym=_scope;
  const isAll = ym==='all';
  const bm=(s.by_month&&s.by_month.data)||{};
  const slice=isAll?null:bm[ym];

  // KPI 값/델타
  let cur, dp={}, dLabel;
  if(isAll){ cur=(s.summary&&s.summary.current)||{}; dp=(s.summary&&s.summary.delta_pct)||{}; dLabel='전년 동기'; }
  else{
    const arr=s.monthly||[]; const idx=arr.findIndex(m=>m.yearMonth===ym); const m=arr[idx]||{};
    const pv=idx>0?arr[idx-1]:null; cur=m; dLabel='전월';
    const keys=['activeUsers','sessions','screenPageViews','newUsers','engagementRate','averageSessionDuration'];
    keys.forEach(k=>{ dp[k]=(pv&&pv[k])?Math.round((( (m[k]||0)/pv[k])-1)*1000)/10:null; });
  }
  const chans=isAll?s.channels:(slice&&slice.channels);
  const ctrys=isAll?s.countries:(slice&&slice.countries);

  const devs =isAll?s.devices:(slice&&slice.devices);

  let html='';
  html+=`<div style="display:flex;align-items:center;margin:2px 0 12px"><span style="font-size:14px;font-weight:800">${isAll?'전체 기간':MONTH_LABEL(ym)} 지표</span><span class="scope-tag">${scopeLabel}${isAll?'':' · 전월 대비'}</span></div>`;

  // 월 선택 연동 인사이트 스트립
  if(!isAll){
    const arr=s.monthly||[], idx=arr.findIndex(m=>m.yearMonth===ym), m=arr[idx]||{}, pv=idx>0?arr[idx-1]:null;
    const chips=[];
    if(pv&&pv.sessions){ const mm=((m.sessions/pv.sessions)-1)*100; chips.push([`세션 <b>${mm>=0?'+':''}${mm.toFixed(0)}%</b> 전월비`, mm>=0?'up':'down']); }
    if(chans&&chans.length){ const t=chans.reduce((a,c)=>a+(c.sessions||0),0)||1; const top=chans[0]; chips.push([`유입 1위 <b>${chLabel(top.sessionDefaultChannelGroup)}</b> ${(top.sessions/t*100).toFixed(0)}%`,'']); }
    if(devs&&devs.length){ const tu=devs.reduce((a,d)=>a+(d.activeUsers||0),0)||1; const mo=devs.find(d=>d.deviceCategory==='mobile'); if(mo) chips.push([`모바일 <b>${(mo.activeUsers/tu*100).toFixed(0)}%</b>`,'']); }
    if(m.engagementRate!=null){ const allEr=(s.summary&&s.summary.current&&s.summary.current.engagementRate)||0; const diff=(m.engagementRate-allEr)*100; chips.push([`참여율 <b>${(m.engagementRate*100).toFixed(0)}%</b> ${allEr?`(평균${diff>=0?'+':''}${diff.toFixed(0)}%p)`:''}`, diff>=0?'up':'down']); }
    if(pages&&pages.length){ chips.push([`인기페이지 1위 <b>${pages[0].pagePath}</b>`,'']); }

  }

  html+=kpiCard('페이지뷰',fmt(cur.screenPageViews),dp.screenPageViews,'',dLabel);
  html+=kpiCard('신규 사용자',fmt(cur.newUsers),dp.newUsers,'',dLabel);
  html+=kpiCard('참여율',fmtPct((cur.engagementRate||0)*100),dp.engagementRate,'',dLabel);
  html+=kpiCard('평균 참여시간',dur(cur.averageSessionDuration),dp.averageSessionDuration,'',dLabel);
  html+='</div>';

  // 좌: 유입 채널(1개, 세로로 김) · 우: 기기 도넛 + 국가·지역(2개 스택) — 위아래 높이 맞춤

  html+=`<div class="card"><h3>유입 채널 <span class="tag">세션 기준</span></h3>${tableBars(chans,'sessionDefaultChannelGroup','채널','sessions','세션',{key:'activeUsers',label:'사용자',fmt:fmt},chLabel)||'<p style="color:var(--ink-faint)">데이터 없음</p>'}</div>`;
  html+='<div style="display:flex;flex-direction:column;gap:18px">';
  html+=`<div class="card"><h3>기기 <span class="tag">사용자 비중</span></h3><div class="chartbox" style="height:230px"><canvas id="deviceChart"></canvas></div></div>`;
  html+=`<div class="card" style="flex:1;display:flex;flex-direction:column"><h3>국가·지역 <span class="tag">사용자 기준</span></h3>${tableBars((ctrys||[]).slice(0,10),'country','국가','activeUsers','사용자',{key:'sessions',label:'세션',fmt:fmt})||'<p style="color:var(--ink-faint)">데이터 없음</p>'}</div>`;
  html+='</div>';
  html+='</div>';

  html+='<div class="grid" style="grid-template-columns:1fr">';
  html+=`<div class="card"><h3>인기 페이지 <span class="tag">페이지뷰 · 탐색깊이</span></h3>${renderPages(pages)}</div>`;
  html+='</div>';

  document.getElementById('scopeArea').innerHTML=html;

  // 기기 도넛 (스코프별 재생성)
  try{
    if(typeof Chart!=='undefined' && devs && devs.length){
      if(window._devChart) window._devChart.destroy();
      window._devChart=new Chart(document.getElementById('deviceChart'),{type:'doughnut',
        data:{labels:devs.map(r=>r.deviceCategory),datasets:[{data:devs.map(r=>r.activeUsers),
          backgroundColor:CAT,borderColor:'#252932',borderWidth:2}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12}}}}});
    }
  }catch(e){console.warn(e);}
}

fetch('data/ga4_latest.json?_t='+Date.now())
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(d=>{ if(!d||!d.sections||!Object.keys(d.sections).length) return renderEmpty('(파일은 있으나 수집 섹션이 비어 있음)'); render(d); })
  .catch(e=>renderEmpty('('+e.message+')'));

// ── 홈페이지 채널 (Revenue Meeting 파싱) ─────────────────────────
function renderRmHome(rm){
  const box=document.getElementById('rmHome'); if(!box||!rm||!rm.main) return;
  const months=Object.keys(rm.main).map(Number).sort((a,b)=>a-b);
  if(!months.length) return;
  const mo=months[0]; const m=rm.main[mo];
  const rnAch=m.rn_ach, revAch=m.rev_ach;
  const cls=v=>v>=100?'up':(v>=90?'flat':'down');
  const arw=v=>v>=100?'▲':'▼';
  let html=`<div class="ins-head" style="margin-top:4px"><span class="t">🏠 홈페이지 채널 · Revenue Meeting</span><span class="b">${rm.source||''} · 투숙 ${mo}월</span></div>`;
  html+='<div class="kpis">';
  html+=`<div class="kpi"><div class="label">예약(RN) 목표→전망</div><div class="val">${NF.format(m.fcst_rn)}<small> / ${NF.format(m.budget_rn)}</small></div><div class="delta ${cls(rnAch)}">${arw(rnAch)} 달성 ${rnAch}% <span style="color:var(--ink-faint);font-weight:500">(${m.fcst_rn-m.budget_rn>=0?'+':''}${NF.format(m.fcst_rn-m.budget_rn)})</span></div></div>`;
  html+=`<div class="kpi"><div class="label">매출 목표→전망(백만)</div><div class="val">${NF.format(m.fcst_rev)}<small> / ${NF.format(m.budget_rev)}</small></div><div class="delta ${cls(revAch)}">${arw(revAch)} 달성 ${revAch}%</div></div>`;
  html+=`<div class="kpi"><div class="label">ADR 목표→전망(천원)</div><div class="val">${NF.format(m.fcst_adr)}<small> / ${NF.format(m.budget_adr)}</small></div><div class="delta ${cls(m.fcst_adr/m.budget_adr*100)}">${m.fcst_adr-m.budget_adr>=0?'▲':'▼'} ${m.fcst_adr-m.budget_adr>=0?'+':''}${m.fcst_adr-m.budget_adr}천원</div></div>`;
  const pk=rm.pickup&&rm.pickup[mo];
  if(pk){
    const cur=pk.rn_2026[pk.rn_2026.length-1], ly=pk.rn_2025[pk.rn_2025.length-1];
    const diff=cur-ly, dp=(cur/ly-1)*100;
    html+=`<div class="kpi"><div class="label">픽업 OTB (26 vs 25)</div><div class="val">${NF.format(cur)}</div><div class="delta ${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${diff>=0?'+':''}${NF.format(diff)} RN (${dp.toFixed(1)}%) 전년비</div></div>`;
  }
  html+='</div>';
  if(pk){ html+=`<div class="card" style="margin-top:16px"><h3>홈페이지 픽업 추이 <span class="tag">주차별 OTB · 26년 vs 25년</span></h3><div class="chartbox" style="height:280px"><canvas id="rmPickChart"></canvas></div></div>`; }
  box.innerHTML=html;
  if(pk && typeof Chart!=='undefined'){
    const wk=(rm.pickup_weeks&&rm.pickup_weeks[mo])||pk.rn_2026.map((_,i)=>'W-'+(4-i));
    try{ new Chart(document.getElementById('rmPickChart'),{type:'line',
      data:{labels:wk,datasets:[
        {label:'26년 OTB',data:pk.rn_2026,borderColor:CAT[0],backgroundColor:CAT[0]+'20',fill:true,tension:.3,pointRadius:3,borderWidth:2},
        {label:'25년 OTB',data:pk.rn_2025,borderColor:'#7a7e85',borderDash:[5,4],tension:.3,pointRadius:2,borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,padding:14}}},
        scales:{x:{grid:{color:'rgba(255,255,255,0.08)'}},y:{grid:{color:'rgba(255,255,255,0.08)'},ticks:{callback:v=>NF.format(v)}}}}});
    }catch(e){console.warn(e);}
  }
}
// ── 키워드·수요 레이더 (외부 뉴스 기반) ─────────────────────────
function renderKeywordRadar(kr){
  const box=document.getElementById('keywordBox'); if(!box||!kr||!kr.groups) return;
  let html=`<div class="ins-head" style="margin-top:24px"><span class="t">🛰️ 키워드·수요 레이더</span><span class="b">외부 뉴스 · 관심의 선행지표</span></div>`;
  html+=`<div class="fc-sub" style="margin:-6px 0 12px">보도량은 <b>관심의 선행지표</b>입니다 — 밖에서 무슨 수요가 도는지 읽어 유입·캠페인 전략의 '왜'를 채웁니다. ${kr.updated?`<span style="color:var(--ink-faint)">· 기준 ${kr.updated}</span>`:''}</div>`;
  // 주목 이슈
  if(kr.highlights&&kr.highlights.length){
    html+='<div class="kw-hi">';
    html+=kr.highlights.map(h=>`<div class="kw-card">
      <div class="kw-top"><span class="kw-ic">${h.icon||'📰'}</span><a href="${h.url}" target="_blank" rel="noopener" class="kw-title">${h.title}</a></div>
      <div class="kw-meta">${h.source||''}${h.date?` · ${h.date}`:''}</div>
      ${h.ga?`<div class="kw-ga">▸ ${h.ga}</div>`:''}</div>`).join('');
    html+='</div>';
  }
  // 그룹별 키워드 보도량
  html+='<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">';
  kr.groups.forEach(g=>{
    const kws=g.kw||[]; const gmax=Math.max(...kws.map(k=>+k.cur||0),1);
    html+=`<div class="card"><h3>${g.name} <span class="tag">보도 건수</span></h3>`;
    html+=kws.map(k=>{
      const cur=+k.cur||0; const hasTop=k.top&&k.top.length;
      let chg='';
      if(typeof k.prev==='number'){ if(k.prev===0) chg='<span class="kw-new">신규</span>';
        else { const p=Math.round((cur-k.prev)/k.prev*100); chg=`<span class="${p>=0?'kw-up':'kw-dn'}">${p>=0?'▲':'▼'}${Math.abs(p)}%</span>`; } }
      const bar=`<div class="cvr-track"><div class="cvr-fill" style="width:${Math.max(cur/gmax*100,cur?4:0).toFixed(0)}%;background:${cur?'var(--gold)':'transparent'}"></div></div>`;
      const head=`<div class="cvr-row" ${hasTop?'style="cursor:pointer"':''}><span class="cvr-name">${k.n} ${chg}</span>${bar}<span class="cvr-val">${cur?cur+'건':'<span style=\"color:var(--ink-faint)\">기사 없음</span>'}</span></div>`;
      if(hasTop){ return `<details class="kw-det"><summary>${head}</summary><div class="kw-links">${k.top.map(a=>`<a href="${a.u}" target="_blank" rel="noopener">· ${a.t}</a>`).join('')}</div></details>`; }
      return head;
    }).join('');
    html+='</div>';
  });
  html+='</div>';
  if(kr.note) html+=`<div class="pins" style="margin-top:12px"><div class="pin" style="border-left-color:var(--ink-faint)">ℹ️ ${kr.note}</div></div>`;
  box.innerHTML=html;
}
fetch('data/homepage_rm.json?_t='+Date.now()).then(r=>r.ok?r.json():null).then(rm=>rm&&renderRmHome(rm)).catch(()=>{});
fetch('data/keyword_radar.json?_t='+Date.now()).then(r=>r.ok?r.json():null).then(kr=>kr&&renderKeywordRadar(kr)).catch(()=>{});
</script>
