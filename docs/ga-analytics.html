<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="auth-required" content="executive">
<script src="./js/auth.js"></script>
<title>웹 애널리틱스 (GA4) · SONO GS 리포트</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#1a1d23; --bg-card:#252932; --bg-deep:#14171c; --bg-soft:#2d3138; --bg-hover:#353a44;
    --ink:#f5f5f7; --ink-soft:#e0e0e3; --ink-muted:#a8acb3; --ink-faint:#7a7e85;
    --gold:#c9a063; --gold-bright:#e6b970;
    --positive:#4caf6f; --warning:#e8a256; --negative:#e57373; --info:#5a9fc4;
    --rule:rgba(255,255,255,0.12); --rule-strong:rgba(255,255,255,0.22);
    --sans:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --mono:'JetBrains Mono','Pretendard Variable',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* ===== 상단 네비 (index.html 공통 gsn 스타일 축약) ===== */
  .gsn{background:var(--bg-deep);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:200}
  .gsn-wrap{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;height:48px;overflow-x:auto}
  .gsn-brand{font-weight:700;color:var(--gold-bright);margin-right:18px;padding-right:16px;border-right:1px solid var(--rule);white-space:nowrap;font-size:13px}
  .gsn-brand-dot{color:var(--gold)}
  .gsn-links{display:flex;gap:2px;flex:1}
  .gsn-item{padding:6px 11px;border-radius:7px;color:var(--ink-muted);font-size:12.5px;white-space:nowrap}
  .gsn-item:hover{background:var(--bg-hover);color:var(--ink)}
  .gsn-item.active{background:var(--bg-soft);color:var(--gold-bright);font-weight:600}
  .gsn-toggle{display:none}

  .wrap{max-width:1280px;margin:0 auto;padding:28px 20px 80px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:6px}
  .eyebrow{color:var(--gold);font-size:12px;letter-spacing:.16em;font-weight:600;text-transform:uppercase}
  h1{font-size:26px;font-weight:800;margin-top:4px}
  .sub{color:var(--ink-muted);font-size:13px;margin-top:4px}
  .meta-line{color:var(--ink-faint);font-size:12px;font-family:var(--mono);text-align:right}
  .divider{height:1px;background:var(--rule);margin:20px 0 24px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .kpi{background:var(--bg-card);border:1px solid var(--rule);border-radius:14px;padding:18px 18px 16px}
  .kpi .label{color:var(--ink-muted);font-size:12.5px;font-weight:600;margin-bottom:10px}
  .kpi .val{font-size:30px;font-weight:800;letter-spacing:-.02em;font-family:var(--mono)}
  .kpi .val small{font-size:15px;color:var(--ink-muted);font-weight:600;margin-left:2px}
  .kpi .delta{font-size:12px;margin-top:8px;font-weight:600}
  .delta.up{color:var(--positive)} .delta.down{color:var(--negative)} .delta.flat{color:var(--ink-faint)}

  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:22px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--bg-card);border:1px solid var(--rule);border-radius:14px;padding:18px 20px}
  .card h3{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--ink)}
  .card h3 .tag{color:var(--ink-faint);font-weight:500;font-size:12px;margin-left:6px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule)}
  th{color:var(--ink-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  tr:last-child td{border-bottom:none}
  .bar-cell{position:relative}
  .bar{position:absolute;left:0;top:50%;transform:translateY(-50%);height:22px;background:linear-gradient(90deg,rgba(201,160,99,.28),rgba(201,160,99,.08));border-radius:5px;z-index:0}
  .bar-cell span{position:relative;z-index:1}

  .empty{background:var(--bg-card);border:1px dashed var(--rule-strong);border-radius:16px;padding:44px 28px;text-align:center;margin-top:26px}
  .empty .ico{font-size:34px;margin-bottom:12px}
  .empty h2{font-size:18px;margin-bottom:8px}
  .empty p{color:var(--ink-muted);font-size:13.5px;max-width:620px;margin:0 auto 6px}
  .empty code{background:var(--bg-deep);padding:2px 7px;border-radius:5px;font-family:var(--mono);font-size:12px;color:var(--gold-bright)}
  .chartbox{position:relative;height:280px}
  .foot{color:var(--ink-faint);font-size:11.5px;margin-top:30px;text-align:center;font-family:var(--mono)}
  .pill{display:inline-block;background:var(--bg-soft);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--ink-muted);margin-left:8px}
</style>
</head>
<body>

<nav class="gsn">
  <div class="gsn-wrap">
    <a class="gsn-brand" href="https://cksals00-ai.github.io/gs_daily_trend_news_public_temp/"><span class="gsn-brand-dot">◈</span> SONO GS팀</a>
    <div class="gsn-links" id="gsn-links">
      <a class="gsn-item" href="https://cksals00-ai.github.io/gs_daily_trend_news_public_temp/">트렌드 리포트</a>
      <a class="gsn-item" href="https://cksals00-ai.github.io/gs_daily_trend_news_public_temp/sales-kpi.html">세일즈 KPI 현황 리포트</a>
      <a class="gsn-item" href="https://cksals00-ai.github.io/gs_daily_trend_news_public_temp/otb.html">GS 실적 리포트</a>
      <a class="gsn-item" href="https://cksals00-ai.github.io/gs_daily_trend_news_public_temp/booking-status.html">Booking Status</a>
      <a class="gsn-item active" href="https://cksals00-ai.github.io/gs_daily_trend_news_public_temp/ga-analytics.html">웹 애널리틱스</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">Web Analytics · Google Analytics 4</div>
      <h1>웹 애널리틱스 <span class="pill">소노호텔앤리조트 통합</span></h1>
      <div class="sub">GA4 속성에서 자동 수집 · 최근 12개월 기준</div>
    </div>
    <div class="meta-line" id="meta-line">불러오는 중…</div>
  </div>
  <div class="divider"></div>

  <div id="content"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const NF = new Intl.NumberFormat('ko-KR');
const fmt = n => (n==null||isNaN(n)) ? '—' : NF.format(Math.round(n));
const fmtPct = n => (n==null||isNaN(n)) ? '—' : (Math.round(n*10)/10).toFixed(1)+'%';
function dur(sec){ if(sec==null||isNaN(sec)) return '—'; sec=Math.round(sec); const m=Math.floor(sec/60), s=sec%60; return m+'분 '+String(s).padStart(2,'0')+'초'; }
function deltaHtml(pct){
  if(pct==null||isNaN(pct)) return '<span class="delta flat">— 전년 동기 대비</span>';
  const up = pct>=0; const cls = Math.abs(pct)<0.05?'flat':(up?'up':'down');
  const arw = cls==='flat'?'•':(up?'▲':'▼');
  return `<span class="delta ${cls}">${arw} ${Math.abs(pct).toFixed(1)}% <span style="color:var(--ink-faint);font-weight:500">전년 동기</span></span>`;
}

const MONTH_LABEL = ym => ym && ym.length===6 ? `${ym.slice(2,4)}.${ym.slice(4,6)}` : ym;

function renderEmpty(reason){
  document.getElementById('meta-line').textContent = '연동 대기중';
  document.getElementById('content').innerHTML = `
    <div class="empty">
      <div class="ico">🔌</div>
      <h2>GA4 연동 설정을 기다리는 중이에요</h2>
      <p>이 페이지는 <code>data/ga4_latest.json</code> 파일을 읽어 GA4 웹 애널리틱스 수치를 보여줍니다. 아직 파일이 없거나 비어 있어요.</p>
      <p style="margin-top:14px">서비스계정 키를 <code>GA4_SA_JSON</code> 시크릿에 등록하고 파이프라인이 한 번 돌면 이 자리에 최근 12개월 지표가 자동으로 채워집니다.</p>
      <p style="margin-top:10px;color:var(--ink-faint)">${reason||''}</p>
    </div>`;
}

function kpiCard(label, val, deltaPct, unit){
  return `<div class="kpi"><div class="label">${label}</div>
    <div class="val">${val}${unit?`<small>${unit}</small>`:''}</div>${deltaHtml(deltaPct)}</div>`;
}

function tableBars(rows, dimKey, dimLabel, valKey, valLabel, extra){
  if(!rows||!rows.length) return '';
  const max = Math.max(...rows.map(r=>Number(r[valKey])||0)) || 1;
  const body = rows.map(r=>{
    const v = Number(r[valKey])||0; const pct=(v/max*100).toFixed(1);
    const ex = extra ? `<td class="num">${extra.fmt(r[extra.key])}</td>` : '';
    let name = r[dimKey]==null||r[dimKey]===''? '(기타)' : r[dimKey];
    if(dimKey==='pagePath' && r.pageTitle) name = `<span style="color:var(--ink)">${r.pageTitle}</span><br><span style="color:var(--ink-faint);font-size:11px;font-family:var(--mono)">${r.pagePath}</span>`;
    return `<tr>
      <td class="bar-cell"><span>${name}</span><div class="bar" style="width:${pct}%"></div></td>
      <td class="num">${fmt(v)}</td>${ex}</tr>`;
  }).join('');
  const exHead = extra?`<th class="num">${extra.label}</th>`:'';
  return `<table><thead><tr><th>${dimLabel}</th><th class="num">${valLabel}</th>${exHead}</tr></thead><tbody>${body}</tbody></table>`;
}

function render(data){
  const s = data.sections || {};
  const cur = (s.summary&&s.summary.current)||{};
  const dp = (s.summary&&s.summary.delta_pct)||{};
  document.getElementById('meta-line').innerHTML =
    `업데이트 ${data.meta?.generated_at||'—'}<br>속성 ${data.meta?.property_id||''} · ${data.meta?.date_range?.label||''}`;

  let html = '<div class="kpis">';
  html += kpiCard('사용자', fmt(cur.activeUsers), dp.activeUsers);
  html += kpiCard('세션', fmt(cur.sessions), dp.sessions);
  html += kpiCard('페이지뷰', fmt(cur.screenPageViews), dp.screenPageViews);
  html += kpiCard('신규 사용자', fmt(cur.newUsers), dp.newUsers);
  html += kpiCard('참여율', fmtPct((cur.engagementRate||0)*100), dp.engagementRate);
  html += kpiCard('평균 참여시간', dur(cur.averageSessionDuration), dp.averageSessionDuration);
  html += '</div>';

  html += '<div class="grid">';
  html += `<div class="card"><h3>월별 추이 <span class="tag">사용자 · 세션 · 페이지뷰</span></h3><div class="chartbox"><canvas id="trendChart"></canvas></div></div>`;
  html += `<div class="card"><h3>기기 <span class="tag">사용자 비중</span></h3><div class="chartbox"><canvas id="deviceChart"></canvas></div></div>`;
  html += '</div>';

  html += '<div class="grid" style="grid-template-columns:1fr 1fr">';
  html += `<div class="card"><h3>유입 채널 <span class="tag">세션 기준</span></h3>${tableBars(s.channels,'sessionDefaultChannelGroup','채널','sessions','세션',{key:'activeUsers',label:'사용자',fmt:fmt})||'<p style="color:var(--ink-faint)">데이터 없음</p>'}</div>`;
  html += `<div class="card"><h3>국가·지역 <span class="tag">사용자 기준</span></h3>${tableBars(s.countries,'country','국가','activeUsers','사용자',{key:'sessions',label:'세션',fmt:fmt})||'<p style="color:var(--ink-faint)">데이터 없음</p>'}</div>`;
  html += '</div>';

  html += `<div class="card" style="margin-top:18px"><h3>인기 페이지 <span class="tag">페이지뷰 상위</span></h3>${tableBars((s.top_pages||[]).slice(0,15),'pagePath','페이지','screenPageViews','페이지뷰',{key:'activeUsers',label:'사용자',fmt:fmt})||'<p style="color:var(--ink-faint)">데이터 없음</p>'}</div>`;

  document.getElementById('content').innerHTML = html;
  document.getElementById('foot').textContent = `출처: ${data.meta?.source||'GA4'} · 자동 수집 파이프라인`;

  // 차트 — Chart.js 로드 실패해도 KPI·표는 그대로 보이도록 방어
  try {
    if (typeof Chart === 'undefined') { console.warn('Chart.js 미로드 — 차트 생략'); return; }
    const gold='#c9a063', info='#5a9fc4', pos='#4caf6f', grid='rgba(255,255,255,0.08)', ink='#a8acb3';
    Chart.defaults.color=ink; Chart.defaults.font.family="'Pretendard Variable',sans-serif";

    if(s.monthly&&s.monthly.length){
      const m=s.monthly;
      new Chart(document.getElementById('trendChart'),{type:'line',
        data:{labels:m.map(r=>MONTH_LABEL(r.yearMonth)),datasets:[
          {label:'사용자',data:m.map(r=>r.activeUsers),borderColor:gold,backgroundColor:'rgba(201,160,99,.12)',fill:true,tension:.34,pointRadius:2},
          {label:'세션',data:m.map(r=>r.sessions),borderColor:info,tension:.34,pointRadius:2},
          {label:'페이지뷰',data:m.map(r=>r.screenPageViews),borderColor:pos,tension:.34,pointRadius:2,hidden:true},
        ]},
        options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
          plugins:{legend:{labels:{boxWidth:12,padding:14}}},
          scales:{x:{grid:{color:grid}},y:{grid:{color:grid},ticks:{callback:v=>NF.format(v)}}}}});
    }
    if(s.devices&&s.devices.length){
      const d=s.devices;
      new Chart(document.getElementById('deviceChart'),{type:'doughnut',
        data:{labels:d.map(r=>r.deviceCategory),datasets:[{data:d.map(r=>r.activeUsers),
          backgroundColor:[gold,info,pos,'#a892c8','#e8a256'],borderColor:'#252932',borderWidth:2}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:14}}}}});
    }
  } catch(err){ console.warn('차트 렌더 실패(무시):', err); }
}

fetch('data/ga4_latest.json?_t='+Date.now())
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(d=>{ if(!d||!d.sections||!Object.keys(d.sections).length) return renderEmpty('(파일은 있으나 수집 섹션이 비어 있음)'); render(d); })
  .catch(e=>renderEmpty('('+e.message+')'));
</script>
<script src="./js/menu-visibility.js"></script>
<script src="./js/visit-log.js"></script>
</body>
</html>
